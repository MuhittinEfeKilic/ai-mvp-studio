<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI MVP Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #101317;
      --panel-2: #14181d;
      --line: #22272e;
      --line-soft: #1a1e24;
      --text: #e6e9ee;
      --muted: #8b949e;
      --dim: #656d76;
      --accent: #d5a253;
      --run: #58a6ff;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    * { box-sizing: border-box; min-width: 0; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    a { color: inherit; }

    .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }

    /* ---- top bar ---- */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 0 18px; height: 52px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .brand { display: flex; align-items: baseline; gap: 9px; font-weight: 620; letter-spacing: -.01em; }
    .brand span { color: var(--dim); font: 11px var(--mono); letter-spacing: 0; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .health { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; }
    .btn {
      border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px;
      padding: 6px 11px; cursor: pointer; font-size: 13px; transition: border-color .12s, background .12s;
    }
    .btn:hover:not(:disabled) { border-color: #333a43; background: #191e24; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #221a08; font-weight: 600; }
    .btn.primary:hover:not(:disabled) { background: #e0af5e; border-color: #e0af5e; }
    .btn.danger { color: var(--bad); }

    /* ---- shell ---- */
    .shell { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 0; }
    .rail { border-right: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto minmax(0,1fr); min-height: 0; }
    .rail-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid var(--line-soft); }
    .rail-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
    .rail-list { overflow-y: auto; }
    .proj {
      display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line-soft);
      background: transparent; padding: 11px 14px; cursor: pointer; border-left: 2px solid transparent;
    }
    .proj:hover { background: var(--panel-2); }
    .proj.active { background: #171c22; border-left-color: var(--accent); }
    .proj-name { display: flex; align-items: center; gap: 8px; font-weight: 550; }
    .proj-name b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
    .proj-sub { margin-top: 5px; display: flex; gap: 8px; align-items: center; color: var(--dim); font: 10.5px var(--mono); }

    /* ---- status ---- */
    .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; background: var(--dim); }
    .dot.run { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    @keyframes pulse { 50% { opacity: .35; } }
    .state { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }

    /* ---- main ---- */
    .main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
    .empty { display: grid; place-items: center; height: 100%; color: var(--dim); }
    .head { padding: 18px 22px 0; }
    .head-top { display: flex; align-items: flex-start; gap: 16px; }
    .head h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.015em; font-weight: 600; }
    .head .path { color: var(--dim); font: 11.5px var(--mono); overflow-wrap: anywhere; }
    .head-actions { margin-left: auto; display: flex; gap: 8px; flex: none; }

    .tabs { display: flex; gap: 2px; padding: 14px 22px 0; border-bottom: 1px solid var(--line); }
    .tab {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      padding: 8px 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13.5px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab .count { color: var(--dim); font: 11px var(--mono); margin-left: 6px; }
    .body { overflow-y: auto; padding: 20px 22px 40px; }

    /* ---- blocks ---- */
    .grid { display: grid; gap: 12px; }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat { border: 1px solid var(--line); border-radius: 7px; padding: 12px 13px; background: var(--panel); }
    .stat b { display: block; font: 600 19px/1.2 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .stat span { display: block; margin-top: 4px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .card { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); overflow: hidden; }
    .card > h3 {
      margin: 0; padding: 10px 13px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
      color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line-soft); background: var(--panel-2);
      display: flex; align-items: center; gap: 8px;
    }
    .card > h3 .right { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--dim); font: 11px var(--mono); }
    .card-body { padding: 13px; }
    .section-gap { margin-top: 16px; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .mono { font-family: var(--mono); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-weight: 600; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 13px; border-bottom: 1px solid var(--line-soft); }
    td { padding: 9px 13px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    td.code { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

    .role {
      font: 11px var(--mono); color: var(--muted); background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap;
    }
    .budget { height: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
    .budget i { display: block; height: 100%; background: var(--accent); }
    .now { display: grid; gap: 10px; }
    .now-item { border: 1px solid var(--line); border-left: 2px solid var(--run); border-radius: 7px; background: var(--panel); padding: 12px 13px; }
    .now-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .now-head b { font-weight: 600; }
    .now-head .elapsed { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
    .now-task { margin-top: 7px; color: var(--muted); font-size: 12.5px; }
    .now-cmd { margin-top: 8px; font: 11.5px/1.5 var(--mono); color: var(--dim); background: #0c0f13; border: 1px solid var(--line-soft); border-radius: 5px; padding: 7px 9px; overflow-wrap: anywhere; max-height: 74px; overflow: hidden; }
    .now-meta { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font: 11.5px var(--mono); }

    .flow { display: grid; gap: 8px; }
    .stage { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
    .stage-head { display: flex; align-items: center; gap: 9px; padding: 10px 13px; }
    .stage-head b { font-weight: 550; font-size: 13.5px; }
    .stage-head .meta { margin-left: auto; color: var(--dim); font: 11px var(--mono); }
    .stage-detail { border-top: 1px solid var(--line-soft); padding: 11px 13px; font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
    .kv { display: grid; grid-template-columns: 116px minmax(0,1fr); gap: 10px; }
    .kv dt { color: var(--dim); font-size: 11.5px; }
    .kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }

    .crit { display: grid; gap: 1px; background: var(--line-soft); }
    .crit-row { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 11px; padding: 10px 13px; background: var(--panel); align-items: start; }
    .crit-row .id { font: 11px var(--mono); color: var(--dim); padding-top: 2px; }
    .crit-row .txt { font-size: 13px; }
    .crit-row .ev { margin-top: 4px; color: var(--dim); font: 11.5px var(--mono); overflow-wrap: anywhere; }

    .log { margin: 0; font: 11.5px/1.6 var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .events { display: grid; gap: 1px; background: var(--line-soft); }
    .ev-row { display: grid; grid-template-columns: 66px 128px minmax(0,1fr); gap: 11px; padding: 7px 13px; background: var(--panel); font: 11.5px var(--mono); }
    .ev-row .t { color: var(--dim); }
    .ev-row .k { color: var(--accent); overflow: hidden; text-overflow: ellipsis; }
    .ev-row .d { color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--muted); cursor: pointer; }
    .chip.on { border-color: var(--accent); color: var(--text); }

    .notice { border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: 7px; background: var(--panel); padding: 14px; }
    .notice h3 { margin: 0 0 5px; font-size: 14px; font-weight: 600; }
    .notice p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .notice .row { display: flex; gap: 9px; align-items: flex-start; flex-wrap: wrap; }
    textarea { width: 100%; min-height: 74px; resize: vertical; padding: 9px 10px; background: #0c0f13; border: 1px solid var(--line); border-radius: 6px; outline: none; }
    textarea:focus { border-color: #39414b; }
    .err { border-left-color: var(--bad); }
    .err .log { color: #f0a5a0; }

    /* ---- new project dialog ---- */
    dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 0; width: min(520px, calc(100% - 32px)); }
    dialog::backdrop { background: #05070ac9; }
    .dlg-head { padding: 15px 18px; border-bottom: 1px solid var(--line-soft); font-weight: 600; }
    .dlg-body { padding: 18px; }
    .drop { display: block; border: 1px dashed #333a43; border-radius: 8px; padding: 18px; text-align: center; cursor: pointer; position: relative; background: var(--panel-2); }
    .drop:hover { border-color: var(--accent); }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .drop strong { display: block; font-size: 13.5px; font-weight: 550; }
    .drop small { color: var(--dim); }
    .dlg-foot { padding: 13px 18px; border-top: 1px solid var(--line-soft); display: flex; gap: 9px; justify-content: flex-end; }
    .report { margin-top: 13px; font-size: 12.5px; color: var(--muted); }
    .report ul { margin: 6px 0 0; padding-left: 17px; }
    .templates { margin-top: 11px; display: flex; gap: 12px; font-size: 12px; }
    .templates a { color: var(--muted); }

    @media (max-width: 1000px) {
      .shell { grid-template-columns: 1fr; }
      .rail { display: none; }
      .cols-4 { grid-template-columns: repeat(2, 1fr); }
      .cols-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">AI MVP Studio <span id="active-runs"></span></div>
      <div class="topbar-right">
        <div class="health"><i class="dot" id="health-dot"></i><span id="health-text">Codex kontrol ediliyor</span></div>
        <button class="btn primary" id="new-project">Yeni proje</button>
      </div>
    </header>

    <div class="shell">
      <aside class="rail">
        <div class="rail-head"><h2>Projeler</h2><span class="dim mono" id="project-count"></span></div>
        <div class="rail-list" id="projects"></div>
      </aside>
      <main class="main" id="main">
        <div class="empty">Bir proje seçin.</div>
      </main>
    </div>
  </div>

  <dialog id="create-dialog">
    <form method="dialog" id="create-form">
      <div class="dlg-head">Onaylanmış spec yükle</div>
      <div class="dlg-body">
        <label class="drop" for="spec-file">
          <strong id="file-label">PROJECT_SPEC.md seç</strong>
          <small>Markdown · en fazla 200 KB</small>
          <input id="spec-file" type="file" accept=".md,text/markdown,text/plain" />
        </label>
        <div class="templates">
          <a href="/api/spec-template/mobile">Mobil şablon</a>
          <a href="/api/spec-template">Genel şablon</a>
        </div>
        <div class="report" id="validation">Doğrulama sonucu burada görünür.</div>
      </div>
      <div class="dlg-foot">
        <button class="btn" value="cancel" id="cancel-create">Vazgeç</button>
        <button class="btn primary" id="start-button" disabled type="button">Üretimi başlat</button>
      </div>
    </form>
  </dialog>

  <script>
    const RUNNING = ['queued', 'planning', 'building', 'testing', 'technically_verified',
      'device_testing', 'device_repair', 'device_test_passed', 'reviewing', 'review_repair'];
    const RESUMABLE = ['paused_context', 'paused_usage', 'interrupted', 'failed', 'awaiting_device_test'];
    const LABELS = {
      queued: 'Sırada', planning: 'Planlanıyor', building: 'Geliştiriliyor', testing: 'Test ediliyor',
      technically_verified: 'Teknik doğrulama tamam', device_testing: 'Cihazda test ediliyor',
      device_repair: 'Cihaz düzeltmesi', device_test_passed: 'Cihaz testi geçti',
      reviewing: 'İnceleniyor', review_repair: 'İnceleme düzeltmesi',
      awaiting_device_test: 'Cihaz bekleniyor', awaiting_user_review: 'Onayınızı bekliyor',
      accepted: 'Kabul edildi', completed: 'Tamamlandı', failed: 'Başarısız',
      paused_context: 'Context duraklaması', paused_usage: 'Limit duraklaması',
      interrupted: 'Kesildi', pending: 'Bekliyor', ready: 'Hazır', running: 'Çalışıyor',
      validating: 'Doğrulanıyor',
    };
    const ROLE_LABELS = {
      architecture: 'Mimari', ux: 'UX', coordinator: 'Koordinatör', flutter_builder: 'Builder',
      integration: 'Entegrasyon', test: 'Test', repair: 'Onarım', device_repair: 'Cihaz onarımı',
      review_repair: 'İnceleme onarımı', reviewer: 'İnceleme',
    };

    let selectedId = null;
    let activeTab = 'overview';
    let detail = null;
    let eventFilter = 'all';
    let loadedSpec = '';
    let specReady = false;

    const el = id => document.getElementById(id);
    const esc = value => { const d = document.createElement('div'); d.textContent = String(value ?? ''); return d.innerHTML; };
    const num = value => Number(value || 0).toLocaleString('tr-TR');
    const setText = (id, value) => { const node = el(id); if (node.textContent !== value) node.textContent = value; };

    function tone(status) {
      if (['completed', 'accepted', 'awaiting_user_review', 'device_test_passed'].includes(status)) return 'ok';
      if (RUNNING.includes(status) || status === 'running' || status === 'validating') return 'run';
      if (['failed', 'paused_context', 'paused_usage'].includes(status)) return 'bad';
      if (['interrupted', 'awaiting_device_test'].includes(status)) return 'warn';
      return '';
    }
    const label = status => LABELS[status] || status;
    const roleLabel = role => ROLE_LABELS[role] || role;

    function duration(from, to) {
      if (!from) return '—';
      const seconds = Math.max(0, Math.round(((to ? new Date(to) : new Date()) - new Date(from)) / 1000));
      if (seconds < 60) return `${seconds}sn`;
      const minutes = Math.floor(seconds / 60);
      return minutes < 60 ? `${minutes}dk ${seconds % 60}sn` : `${Math.floor(minutes / 60)}sa ${minutes % 60}dk`;
    }

    function formatMs(milliseconds) {
      const seconds = Math.max(0, Math.round(milliseconds / 1000));
      if (seconds < 60) return `${seconds}sn`;
      const minutes = Math.floor(seconds / 60);
      return minutes < 60 ? `${minutes}dk ${seconds % 60}sn` : `${Math.floor(minutes / 60)}sa ${minutes % 60}dk`;
    }

    const runSpan = run => (run.started_at
      ? (run.completed_at ? new Date(run.completed_at) : new Date()) - new Date(run.started_at)
      : 0);

    /** Per-role totals: how much agent time each part of the pipeline consumed. */
    function agentTotals(runs) {
      const byRole = new Map();
      for (const run of runs) {
        const entry = byRole.get(run.role) || { role: run.role, count: 0, ms: 0, fresh: 0, out: 0 };
        entry.count += 1;
        entry.ms += runSpan(run);
        entry.fresh += Math.max(0, (run.input_tokens || 0) - (run.cached_input_tokens || 0));
        entry.out += Number(run.output_tokens || 0);
        byRole.set(run.role, entry);
      }
      return [...byRole.values()].sort((left, right) => right.ms - left.ms);
    }

    /**
     * Wall time during which at least one agent was running. Comparing it with the
     * summed time is the only honest way to read parallelism: agents overlap, so
     * the sum alone says nothing about how long the pipeline actually took.
     */
    function agentBusyMs(runs) {
      const spans = runs
        .filter(run => run.started_at)
        .map(run => [
          +new Date(run.started_at),
          run.completed_at ? +new Date(run.completed_at) : Date.now(),
        ])
        .sort((left, right) => left[0] - right[0]);
      let total = 0;
      let current = null;
      for (const [start, end] of spans) {
        if (!current || start > current[1]) {
          if (current) total += current[1] - current[0];
          current = [start, end];
        } else current[1] = Math.max(current[1], end);
      }
      return current ? total + (current[1] - current[0]) : total;
    }

    /**
     * A task's started_at/completed_at can span several resumes, so the span
     * between them is not a runtime. Only a task running right now has one.
     */
    function taskTiming(task) {
      if (task.status === 'running') return duration(task.started_at);
      if (task.completed_at) return clock(task.completed_at);
      return '—';
    }
    const clock = value => (value ? new Date(value).toLocaleTimeString('tr-TR', { hour12: false }) : '');

    async function api(url, options) {
      const response = await fetch(url, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || 'İşlem başarısız.');
      return body;
    }

    /* ---------- derived views ---------- */

    function lastVerdict(runs) {
      const reviews = runs.filter(run => run.role === 'reviewer' && run.final_message);
      if (!reviews.length) return null;
      const raw = reviews[reviews.length - 1].final_message;
      const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
      try { return JSON.parse(fenced ? fenced[1] : raw); } catch { return null; }
    }

    /** Latest command / file activity an agent reported, for the live view. */
    function agentActivity(events, agentName) {
      const mine = events.filter(event => event.payload && event.payload.agent === agentName);
      let command = null;
      let files = 0;
      for (const event of mine) {
        const item = event.payload.item;
        if (!item) continue;
        if (item.type === 'command_execution' && item.command) command = shortCommand(item.command);
        if (item.type === 'file_change' && event.event_type === 'item.completed') {
          files += (item.changes || []).length;
        }
      }
      return { command, files };
    }

    /** Codex wraps everything in a shell invocation; only the command matters. */
    function shortCommand(command) {
      const stripped = String(command || '')
        .replace(/^"?[^"]*(?:powershell\.exe|cmd\.exe|bash(?:\.exe)?)"?\s*(?:-Command|\/d\s*\/s\s*\/c|-lc)?\s*/i, '')
        .trim();
      // Only unwrap a matching pair; a script may legitimately begin with a quote.
      const first = stripped[0];
      return (first === "'" || first === '"') && stripped.endsWith(first) && stripped.length > 1
        ? stripped.slice(1, -1).trim()
        : stripped;
    }

    function eventSummary(event) {
      const payload = event.payload || {};
      const item = payload.item;
      if (item && item.type === 'command_execution') {
        const exit = item.exit_code === undefined ? '' : ` · exit ${item.exit_code}`;
        return `${shortCommand(item.command).slice(0, 200)}${exit}`;
      }
      if (item && item.type === 'file_change') {
        return (item.changes || []).map(change => `${change.kind}: ${String(change.path).split(/[\\/]/).slice(-2).join('/')}`).join(', ');
      }
      if (item && item.type === 'agent_message') return String(item.text || '').slice(0, 240);
      if (event.event_type === 'stderr') return String(payload.text || '').slice(0, 240);
      const { agent, role, item: _item, type, ...rest } = payload;
      const body = JSON.stringify(rest);
      return body === '{}' ? '' : body.slice(0, 240);
    }

    /* ---------- rendering ---------- */

    async function refreshHealth() {
      try {
        const health = await api('/api/health');
        el('health-dot').className = `dot ${health.codex_available ? 'ok' : 'bad'}`;
        el('health-text').textContent = health.codex_available ? 'Codex hazır' : 'Codex bulunamadı';
        tokenBudget = Number(health.token_budget || 0);
      } catch { /* topbar stays as-is */ }
    }

    let railSignature = null;

    async function refreshProjects() {
      const projects = await api('/api/projects');
      const running = projects.filter(project => RUNNING.includes(project.status)).length;
      // Only write when the value moves; needless DOM churn fights the user.
      setText('project-count', String(projects.length));
      setText('active-runs', running ? `${running} çalışıyor` : '');
      // Rewriting the rail on every poll would invalidate whatever the user is
      // interacting with, so it only redraws when the list actually changes.
      const nextRail = JSON.stringify([projects.map(p => [p.id, p.name, p.status]), selectedId]);
      if (nextRail === railSignature) {
        if (selectedId) await loadProject();
        return;
      }
      railSignature = nextRail;
      el('projects').innerHTML = projects.length
        ? projects.map(project => `
          <button class="proj ${project.id === selectedId ? 'active' : ''}" data-id="${project.id}">
            <div class="proj-name"><i class="dot ${tone(project.status)}"></i><b>${esc(project.name)}</b></div>
            <div class="proj-sub"><span>${project.id}</span><span>${esc(label(project.status))}</span></div>
          </button>`).join('')
        : '<div style="padding:14px" class="dim">Henüz proje yok.</div>';
      for (const node of document.querySelectorAll('.proj')) {
        node.onclick = () => {
          selectedId = node.dataset.id;
          lastSignature = null;
          railSignature = null;
          loadProject({ force: true });
        };
      }
      if (!selectedId && projects.length) { selectedId = projects[0].id; }
      if (selectedId) await loadProject();
    }

    /**
     * Everything the panel actually shows. Polling re-renders only when this
     * changes, so open panels, typed feedback and scroll position survive.
     */
    function signature(project) {
      return JSON.stringify([
        project.id, project.status, project.error, project.final_message,
        project.quality_report, project.device_report, project.artifact_path,
        (project.tasks || []).map(task => [task.id, task.status, task.attempt_count, task.error]),
        (project.agent_runs || []).map(run => [run.id, run.status, run.output_tokens, run.context_chars]),
        (project.events || []).length,
      ]);
    }

    // UI state lives here rather than being scraped from the DOM, so it survives
    // both background polling and tab switches.
    const openTasks = new Set();
    const autoOpened = new Set();
    const scrollByTab = {};
    let feedbackDraft = '';
    let tokenBudget = 0;

    function captureScroll() {
      const body = document.getElementById('tab-body');
      if (body) scrollByTab[activeTab] = body.scrollTop;
    }

    function restoreUiState() {
      const body = document.getElementById('tab-body');
      if (body && scrollByTab[activeTab]) body.scrollTop = scrollByTab[activeTab];
      const input = document.querySelector('[data-feedback]');
      if (input) {
        input.value = feedbackDraft;
        input.oninput = () => { feedbackDraft = input.value; };
      }
      for (const node of document.querySelectorAll('.stage')) {
        node.open = openTasks.has(node.dataset.task);
        node.ontoggle = () => {
          if (node.open) openTasks.add(node.dataset.task);
          else openTasks.delete(node.dataset.task);
        };
      }
    }

    let lastSignature = null;

    async function loadProject({ force = false } = {}) {
      if (!selectedId) return;
      const next = await api(`/api/projects/${selectedId}`);
      for (const node of document.querySelectorAll('.proj')) {
        node.classList.toggle('active', node.dataset.id === selectedId);
      }
      const nextSignature = signature(next);
      const running = (next.agent_runs || []).some(run => run.status === 'running');
      detail = next;
      // A running agent needs its elapsed clock refreshed even when nothing else moved.
      if (!force && nextSignature === lastSignature && !running) return;
      lastSignature = nextSignature;
      renderProject();
    }

    function renderProject() {
      captureScroll();
      const project = detail;
      const tasks = project.tasks || [];
      const runs = project.agent_runs || [];
      const events = project.events || [];
      const active = runs.filter(run => run.status === 'running');
      const canResume = RESUMABLE.includes(project.status);
      const awaits = ['awaiting_user_review', 'accepted'].includes(project.status);

      const tabs = [
        ['overview', 'Genel', ''],
        ['agents', 'Agentlar', active.length ? String(active.length) : ''],
        ['pipeline', 'Pipeline', `${tasks.filter(t => t.status === 'completed').length}/${tasks.length}`],
        ['activity', 'Etkinlik', String(events.length)],
      ];

      el('main').innerHTML = `
        <div class="head">
          <div class="head-top">
            <div>
              <h1>${esc(project.name)}</h1>
              <div class="state"><i class="dot ${tone(project.status)}"></i>${esc(label(project.status))}</div>
              <div class="path">${esc(project.workspace_path)}</div>
            </div>
            <div class="head-actions">
              ${project.artifact_path ? `<a class="btn" href="/api/projects/${project.id}/artifact">APK indir</a>` : ''}
              ${canResume ? `<button class="btn primary" data-act="resume">${project.status === 'awaiting_device_test' ? 'Cihaz testini yeniden dene' : 'Checkpoint’ten devam et'}</button>` : ''}
            </div>
          </div>
        </div>
        <nav class="tabs">
          ${tabs.map(([key, text, count]) => `
            <button class="tab ${activeTab === key ? 'active' : ''}" data-tab="${key}">
              ${text}${count ? `<span class="count">${count}</span>` : ''}
            </button>`).join('')}
        </nav>
        <div class="body" id="tab-body"></div>`;

      const body = el('tab-body');
      if (activeTab === 'overview') body.innerHTML = renderOverview(project, tasks, runs, awaits);
      else if (activeTab === 'agents') body.innerHTML = renderAgents(runs, tasks, events, active);
      else if (activeTab === 'pipeline') body.innerHTML = renderPipeline(tasks);
      else body.innerHTML = renderActivity(events);

      wire();
      restoreUiState();
    }

    function renderOverview(project, tasks, runs, awaits) {
      const done = tasks.filter(task => task.status === 'completed').length;
      const fresh = runs.reduce((sum, run) => sum + Math.max(0, (run.input_tokens || 0) - (run.cached_input_tokens || 0)), 0);
      const out = runs.reduce((sum, run) => sum + Number(run.output_tokens || 0), 0);
      const quality = project.quality_report ? JSON.parse(project.quality_report) : null;
      const device = project.device_report ? JSON.parse(project.device_report) : null;
      const verdict = lastVerdict(runs);

      const checkRow = (name, check) => `
        <tr><td><span class="state"><i class="dot ${check.status === 'PASS' ? 'ok' : check.status === 'SKIPPED' ? '' : 'bad'}"></i>${esc(name)}</span></td>
        <td class="code">${esc(check.status)}${check.exit_code === null || check.exit_code === undefined ? '' : ` · exit ${check.exit_code}`}</td></tr>`;

      return `
        <div class="grid cols-4">
          <div class="stat"><b>${done}/${tasks.length}</b><span>Görev</span></div>
          <div class="stat"><b>${duration(project.created_at, RUNNING.includes(project.status) ? null : project.updated_at)}</b><span>Süre</span></div>
          <div class="stat"><b>${num(fresh)}</b><span>Yeni giriş tokenı</span></div>
          <div class="stat"><b>${num(out)}</b><span>Çıkış tokenı</span></div>
        </div>

        ${awaits ? `
        <div class="notice section-gap">
          <h3>Ürün incelemesi</h3>
          <p>Teknik ve cihaz kapıları tamamlandı. Ürünü kabul edebilir veya hedefli bir düzeltme turu başlatabilirsiniz.</p>
          <div class="row">
            <button class="btn primary" data-act="accept">Ürünü kabul et</button>
            <div style="flex:1;min-width:240px">
              <textarea data-feedback placeholder="Düzeltilmesini istediğiniz noktayı yazın…"></textarea>
              <button class="btn" style="margin-top:7px" data-act="feedback">Geri bildirim gönder</button>
            </div>
          </div>
        </div>` : ''}

        ${project.error ? `<div class="notice err section-gap"><h3>Hata</h3><pre class="log">${esc(project.error)}</pre></div>` : ''}

        <div class="grid cols-2 section-gap">
          <div class="card">
            <h3>Kalite kapısı <span class="right">${quality ? esc(quality.status) : '—'}</span></h3>
            ${quality ? `<table>${Object.entries(quality.checks).map(([name, check]) => checkRow(name, check)).join('')}</table>`
              : '<div class="card-body dim">Henüz rapor yok.</div>'}
          </div>
          <div class="card">
            <h3>Cihaz kapısı <span class="right">${device ? esc(device.status) : '—'}</span></h3>
            ${device ? `<table>${Object.entries(device.checks || {}).map(([name, check]) => checkRow(name, check)).join('')}</table>
              ${device.reason ? `<div class="card-body dim">${esc(device.reason)}</div>` : ''}`
              : '<div class="card-body dim">Henüz cihaz koşusu yok.</div>'}
          </div>
        </div>

        ${verdict && verdict.criteria && verdict.criteria.length ? `
        <div class="card section-gap">
          <h3>Kabul kriterleri <span class="right">${verdict.criteria.filter(c => c.status === 'PASS').length}/${verdict.criteria.length}</span></h3>
          <div class="crit">
            ${verdict.criteria.map(item => `
              <div class="crit-row">
                <span class="id"><i class="dot ${item.status === 'PASS' ? 'ok' : 'bad'}"></i> ${esc(item.id)}</span>
                <div><div class="txt">${esc(criterionText(item.id) || item.evidence || '')}</div>
                ${item.evidence ? `<div class="ev">${esc(item.evidence)}</div>` : ''}</div>
              </div>`).join('')}
          </div>
        </div>` : ''}

        ${verdict && verdict.notes && verdict.notes.length ? `
        <div class="card section-gap">
          <h3>İnceleme notları <span class="right">engelleyici değil</span></h3>
          <div class="card-body"><pre class="log">${esc(verdict.notes.map(note => `• ${note}`).join('\n'))}</pre></div>
        </div>` : ''}

        ${project.final_message ? `
        <div class="card section-gap"><h3>Sonuç özeti</h3>
          <div class="card-body"><pre class="log">${esc(project.final_message)}</pre></div></div>` : ''}`;
    }

    /** Acceptance criteria text lives in the reviewer verdict only by id. */
    function criterionText(id) {
      const verdict = lastVerdict(detail.agent_runs || []);
      const found = (verdict && verdict.criteria || []).find(item => item.id === id);
      return found && found.text ? found.text : id;
    }

    function renderAgents(runs, tasks, events, active) {
      const taskFor = run => tasks.find(task => task.status === 'running' && task.role === run.role)
        || tasks.find(task => run.agent_name.includes(task.name));

      const live = active.length ? `
        <div class="now">
          ${active.map(run => {
            const activity = agentActivity(events, run.agent_name);
            const task = taskFor(run);
            return `
            <div class="now-item">
              <div class="now-head">
                <i class="dot run"></i><b>${esc(run.agent_name)}</b>
                <span class="role">${esc(roleLabel(run.role))}</span>
                <span class="elapsed">${duration(run.started_at)}</span>
              </div>
              ${task ? `<div class="now-task">Görev: <b>${esc(task.name)}</b> · yollar <span class="mono">${esc((task.allowed_paths || []).join(', ') || '—')}</span></div>` : ''}
              ${activity.command ? `<div class="now-cmd">${esc(activity.command)}</div>` : '<div class="now-cmd dim">komut bekleniyor…</div>'}
              <div class="now-meta">
                <span>${activity.files} dosya değişikliği</span>
                <span>${num(run.context_chars)} context karakteri</span>
                <span>${num(run.output_tokens)} çıkış tokenı</span>
              </div>
            </div>`;
          }).join('')}
        </div>`
        : '<div class="card"><div class="card-body dim">Şu anda çalışan agent yok.</div></div>';

      const history = runs.slice().reverse().map(run => `
        <tr>
          <td><span class="state"><i class="dot ${tone(run.status)}"></i>${esc(run.agent_name)}</span>
            ${run.error ? `<div class="dim mono" style="margin-top:4px;font-size:11px">${esc(String(run.error).slice(0, 160))}</div>` : ''}</td>
          <td><span class="role">${esc(roleLabel(run.role))}</span></td>
          <td class="num">${duration(run.started_at, run.completed_at)}</td>
          <td class="num">${num(Math.max(0, (run.input_tokens || 0) - (run.cached_input_tokens || 0)))}</td>
          <td class="num">${num(run.output_tokens)}</td>
          <td class="num dim">${clock(run.started_at)}</td>
        </tr>`).join('');

      const totals = agentTotals(runs);
      const billable = runs.reduce((sum, run) =>
        sum + Math.max(0, (run.input_tokens || 0) - (run.cached_input_tokens || 0))
        + Number(run.output_tokens || 0), 0);
      const summed = totals.reduce((sum, entry) => sum + entry.ms, 0);
      const busy = agentBusyMs(runs);
      const overlap = busy > 0 ? summed / busy : 0;

      const totalsBlock = runs.length ? `
        <div class="grid cols-4 section-gap">
          <div class="stat"><b>${formatMs(summed)}</b><span>Toplam agent süresi</span></div>
          <div class="stat"><b>${formatMs(busy)}</b><span>Agent meşgul süresi</span></div>
          <div class="stat"><b>x${overlap.toFixed(2)}</b><span>Örtüşme</span></div>
          <div class="stat"><b>${runs.length}</b><span>Agent koşusu</span></div>
        </div>
        ${tokenBudget ? `<div class="card section-gap">
          <h3>Token bütçesi <span class="right">${num(billable)} / ${num(tokenBudget)}</span></h3>
          <div class="card-body">
            <div class="budget"><i style="width:${Math.min(100, Math.round((billable / tokenBudget) * 100))}%"></i></div>
            <div class="dim" style="margin-top:7px;font-size:12px">
              Faturalanabilir = cache dışı giriş + çıkış. Sınır kesintisiz bir çalışma içindir;
              devam ettirmek yeni bütçe başlatır.
            </div>
          </div>
        </div>` : ''}
        <div class="card section-gap">
          <h3>Rol bazında süre <span class="right">toplam ${formatMs(summed)}</span></h3>
          <table>
            <thead><tr><th>Rol</th><th style="text-align:right">Koşu</th>
              <th style="text-align:right">Toplam süre</th><th style="text-align:right">Pay</th>
              <th style="text-align:right">Yeni giriş</th><th style="text-align:right">Çıkış</th></tr></thead>
            <tbody>${totals.map(entry => `
              <tr>
                <td><span class="role">${esc(roleLabel(entry.role))}</span></td>
                <td class="num">${entry.count}</td>
                <td class="num">${formatMs(entry.ms)}</td>
                <td class="num dim">${summed ? Math.round((entry.ms / summed) * 100) : 0}%</td>
                <td class="num">${num(entry.fresh)}</td>
                <td class="num">${num(entry.out)}</td>
              </tr>`).join('')}</tbody>
          </table>
        </div>` : '';

      return `${live}${totalsBlock}
        <div class="card section-gap">
          <h3>Agent geçmişi <span class="right">${runs.length} koşu</span></h3>
          <table>
            <thead><tr><th>Agent</th><th>Rol</th><th style="text-align:right">Süre</th>
              <th style="text-align:right">Yeni giriş</th><th style="text-align:right">Çıkış</th><th style="text-align:right">Başlangıç</th></tr></thead>
            <tbody>${history || '<tr><td colspan="6" class="dim">Henüz agent koşusu yok.</td></tr>'}</tbody>
          </table>
        </div>`;
    }

    function renderPipeline(tasks) {
      // Reveal a task once when it starts running; after that the user decides.
      for (const task of tasks) {
        if (task.status === 'running' && !autoOpened.has(task.id)) {
          autoOpened.add(task.id);
          openTasks.add(task.id);
        }
      }
      if (!tasks.length) return '<div class="card"><div class="card-body dim">Görev grafiği hazırlanıyor…</div></div>';
      return `<div class="flow">${tasks.map(task => `
        <details class="stage" data-task="${esc(task.id)}">
          <summary class="stage-head">
            <i class="dot ${tone(task.status)}"></i>
            <b>${esc(task.name)}</b>
            <span class="role">${esc(roleLabel(task.role))}</span>
            <span class="meta">${esc(label(task.status))} · ${task.attempt_count} deneme · ${taskTiming(task)}</span>
          </summary>
          <div class="stage-detail">
            <dl class="kv">
              <dt>Yollar</dt><dd>${esc((task.allowed_paths || []).join(', ') || '—')}</dd>
              ${(task.required_outputs || []).length ? `<dt>Çıktılar</dt><dd>${esc(task.required_outputs.join(', '))}</dd>` : ''}
              ${(task.depends_on || []).length ? `<dt>Bağımlılık</dt><dd>${esc(task.depends_on.map(id => id.split(':').pop()).join(', '))}</dd>` : ''}
              ${task.branch_name ? `<dt>Branch</dt><dd>${esc(task.branch_name)}</dd>` : ''}
              ${task.checkpoint_commit ? `<dt>Checkpoint</dt><dd>${esc(task.checkpoint_commit.slice(0, 10))}</dd>` : ''}
            </dl>
            ${task.error ? `<pre class="log" style="color:#f0a5a0">${esc(task.error)}</pre>` : ''}
            ${['failed', 'paused_context', 'paused_usage', 'interrupted'].includes(task.status)
              ? `<div><button class="btn" data-act="retry" data-task="${encodeURIComponent(task.id)}">Görevi yeniden dene</button></div>` : ''}
          </div>
        </details>`).join('')}</div>`;
    }

    function renderActivity(events) {
      const groups = [['all', 'Tümü'], ['command', 'Komutlar'], ['file', 'Dosyalar'],
        ['message', 'Agent mesajları'], ['gate', 'Kapılar'], ['stderr', 'stderr']];
      const matches = event => {
        const type = event.payload && event.payload.item && event.payload.item.type;
        if (eventFilter === 'all') return true;
        if (eventFilter === 'command') return type === 'command_execution';
        if (eventFilter === 'file') return type === 'file_change';
        if (eventFilter === 'message') return type === 'agent_message';
        if (eventFilter === 'stderr') return event.event_type === 'stderr';
        return !event.event_type.startsWith('item.') && !['stderr', 'turn.started', 'turn.completed', 'thread.started'].includes(event.event_type);
      };
      const rows = events.filter(matches).slice(-200).reverse().map(event => `
        <div class="ev-row">
          <span class="t">${clock(event.created_at)}</span>
          <span class="k">${esc(event.payload && event.payload.agent ? roleLabel(event.payload.role) : event.event_type)}</span>
          <span class="d">${esc(eventSummary(event) || event.event_type)}</span>
        </div>`).join('');
      return `
        <div class="filters">${groups.map(([key, text]) =>
          `<button class="chip ${eventFilter === key ? 'on' : ''}" data-filter="${key}">${text}</button>`).join('')}</div>
        <div class="card"><div class="events">${rows || '<div class="ev-row"><span class="d dim">Kayıt yok.</span></div>'}</div></div>`;
    }

    /* ---------- interactions ---------- */

    function wire() {
      for (const node of document.querySelectorAll('.tab')) {
        node.onclick = () => {
          captureScroll();
          activeTab = node.dataset.tab;
          lastSignature = null;
          renderProject();
        };
      }
      for (const node of document.querySelectorAll('[data-filter]')) {
        node.onclick = () => { eventFilter = node.dataset.filter; lastSignature = null; renderProject(); };
      }
      const act = async (node, run) => {
        node.disabled = true;
        try { await run(); await loadProject({ force: true }); } catch (error) { node.disabled = false; alert(error.message); }
      };
      const resume = document.querySelector('[data-act="resume"]');
      if (resume) resume.onclick = () => act(resume, () => api(`/api/projects/${selectedId}/resume`, { method: 'POST' }));
      const accept = document.querySelector('[data-act="accept"]');
      if (accept) accept.onclick = () => act(accept, () => api(`/api/projects/${selectedId}/accept`, { method: 'POST' }));
      const feedback = document.querySelector('[data-act="feedback"]');
      if (feedback) {
        feedback.onclick = () => {
          const input = document.querySelector('[data-feedback]');
          const message = input.value.trim();
          if (!message) { input.focus(); return; }
          act(feedback, () => api(`/api/projects/${selectedId}/feedback`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }),
          }));
        };
      }
      for (const node of document.querySelectorAll('[data-act="retry"]')) {
        node.onclick = () => act(node, () => api(
          `/api/projects/${selectedId}/tasks/${node.dataset.task}/retry`, { method: 'POST' },
        ));
      }
    }

    function resetCreateDialog() {
      // A file input does not fire `change` when the same file is picked again, so
      // reopening the dialog and re-selecting the spec would leave the button
      // disabled with no explanation. Clearing it makes every pick count.
      el('create-form').reset();
      el('spec-file').value = '';
      loadedSpec = '';
      specReady = false;
      el('start-button').disabled = true;
      el('file-label').textContent = 'PROJECT_SPEC.md seç';
      el('validation').textContent = 'Doğrulama sonucu burada görünür.';
    }

    el('new-project').onclick = () => {
      resetCreateDialog();
      el('create-dialog').showModal();
    };
    el('cancel-create').onclick = () => el('create-dialog').close();
    el('create-dialog').addEventListener('close', resetCreateDialog);

    el('spec-file').onchange = async event => {
      const file = event.target.files[0];
      el('file-label').textContent = file ? file.name : 'PROJECT_SPEC.md seç';
      loadedSpec = file ? await file.text() : '';
      specReady = false;
      el('start-button').disabled = true;
      if (!loadedSpec) { el('validation').textContent = 'Dosya okunamadı.'; return; }
      try {
        const report = await api('/api/specs/validate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spec_content: loadedSpec }),
        });
        specReady = report.ready;
        el('start-button').disabled = !report.ready;
        el('validation').innerHTML = `
          <div class="state"><i class="dot ${report.ready ? 'ok' : 'bad'}"></i>
            ${report.ready ? 'Üretime hazır' : 'Eksik kararlar var'} · ${esc(report.project_name || 'İsimsiz')} · ${report.score}/100</div>
          ${report.blocking_issues.length ? `<ul>${report.blocking_issues.map(issue =>
            `<li>${esc(issue.section)}: ${esc(issue.message)}</li>`).join('')}</ul>` : ''}`;
      } catch (error) { el('validation').textContent = error.message; }
    };

    el('start-button').onclick = async () => {
      if (!specReady || !loadedSpec) return;
      el('start-button').disabled = true;
      try {
        const project = await api('/api/projects', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spec_content: loadedSpec }),
        });
        selectedId = project.id;
        activeTab = 'agents';
        railSignature = null;
        lastSignature = null;
        el('create-dialog').close();
        await refreshProjects();
      } catch (error) {
        el('validation').textContent = error.message;
        el('start-button').disabled = false;
      }
    };

    refreshHealth();
    refreshProjects().catch(error => { el('main').innerHTML = `<div class="empty">${esc(error.message)}</div>`; });
    setInterval(() => refreshProjects().catch(() => {}), 4000);
    setInterval(refreshHealth, 30000);
  </script>
</body>
</html>
