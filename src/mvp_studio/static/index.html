<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI MVP Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #101317;
      --panel-2: #14181d;
      --line: #22272e;
      --line-soft: #1a1e24;
      --text: #e6e9ee;
      --muted: #8b949e;
      --dim: #656d76;
      --accent: #d5a253;
      --run: #58a6ff;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    * { box-sizing: border-box; min-width: 0; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    a { color: inherit; }

    .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }

    /* ---- top bar ---- */
    .topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 0 18px; height: 52px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .brand { display: flex; align-items: baseline; gap: 9px; font-weight: 620; letter-spacing: -.01em; }
    .brand span { color: var(--dim); font: 11px var(--mono); letter-spacing: 0; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .health { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; }
    .btn {
      border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px;
      padding: 6px 11px; cursor: pointer; font-size: 13px; transition: border-color .12s, background .12s;
    }
    .btn:hover:not(:disabled) { border-color: #333a43; background: #191e24; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #221a08; font-weight: 600; }
    .btn.primary:hover:not(:disabled) { background: #e0af5e; border-color: #e0af5e; }
    .btn.danger { color: var(--bad); }

    /* ---- shell ---- */
    .shell { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 0; }
    .rail { border-right: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto minmax(0,1fr); min-height: 0; }
    .rail-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; border-bottom: 1px solid var(--line-soft); }
    .rail-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
    .rail-list { overflow-y: auto; }
    .proj {
      display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line-soft);
      background: transparent; padding: 11px 14px; cursor: pointer; border-left: 2px solid transparent;
    }
    .proj:hover { background: var(--panel-2); }
    .proj.active { background: #171c22; border-left-color: var(--accent); }
    .proj-name { display: flex; align-items: center; gap: 8px; font-weight: 550; }
    .proj-name b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
    .proj-sub { margin-top: 5px; display: flex; gap: 8px; align-items: center; color: var(--dim); font: 10.5px var(--mono); }

    /* ---- status ---- */
    .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; background: var(--dim); }
    .dot.run { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    @keyframes pulse { 50% { opacity: .35; } }
    .state { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }

    /* ---- main ---- */
    .main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
    .empty { display: grid; place-items: center; height: 100%; color: var(--dim); }
    .head { padding: 18px 22px 0; }
    .head-top { display: flex; align-items: flex-start; gap: 16px; }
    .head h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.015em; font-weight: 600; }
    .head .path { color: var(--dim); font: 11.5px var(--mono); overflow-wrap: anywhere; }
    .head-actions { margin-left: auto; display: flex; gap: 8px; flex: none; }

    .tabs { display: flex; gap: 2px; padding: 14px 22px 0; border-bottom: 1px solid var(--line); }
    .tab {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      padding: 8px 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13.5px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab .count { color: var(--dim); font: 11px var(--mono); margin-left: 6px; }
    .body { overflow-y: auto; padding: 20px 22px 40px; }

    /* ---- blocks ---- */
    .grid { display: grid; gap: 12px; }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat { border: 1px solid var(--line); border-radius: 7px; padding: 12px 13px; background: var(--panel); }
    .stat b { display: block; font: 600 19px/1.2 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .stat span { display: block; margin-top: 4px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .card { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); overflow: hidden; }
    .card > h3 {
      margin: 0; padding: 10px 13px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
      color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line-soft); background: var(--panel-2);
      display: flex; align-items: center; gap: 8px;
    }
    .card > h3 .right { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--dim); font: 11px var(--mono); }
    .card-body { padding: 13px; }
    .section-gap { margin-top: 16px; }
    .muted { color: var(--muted); }
    .dim { color: var(--dim); }
    .mono { font-family: var(--mono); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-weight: 600; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 13px; border-bottom: 1px solid var(--line-soft); }
    td { padding: 9px 13px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    td.code { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

    .role {
      font: 11px var(--mono); color: var(--muted); background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap;
    }
    .budget { height: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
    .budget i { display: block; height: 100%; background: var(--accent); }
    .now { display: grid; gap: 10px; }
    .now-item { border: 1px solid var(--line); border-left: 2px solid var(--run); border-radius: 7px; background: var(--panel); padding: 12px 13px; }
    .now-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .now-head b { font-weight: 600; }
    .now-head .elapsed { margin-left: auto; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
    .now-task { margin-top: 7px; color: var(--muted); font-size: 12.5px; }
    .now-cmd { margin-top: 8px; font: 11.5px/1.5 var(--mono); color: var(--dim); background: #0c0f13; border: 1px solid var(--line-soft); border-radius: 5px; padding: 7px 9px; overflow-wrap: anywhere; max-height: 74px; overflow: hidden; }
    .now-meta { margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font: 11.5px var(--mono); }

    .flow { display: grid; gap: 8px; }
    .stage { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
    .stage-head { display: flex; align-items: center; gap: 9px; padding: 10px 13px; }
    .stage-head b { font-weight: 550; font-size: 13.5px; }
    .stage-head .meta { margin-left: auto; color: var(--dim); font: 11px var(--mono); }
    .stage-detail { border-top: 1px solid var(--line-soft); padding: 11px 13px; font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
    .kv { display: grid; grid-template-columns: 116px minmax(0,1fr); gap: 10px; }
    .kv dt { color: var(--dim); font-size: 11.5px; }
    .kv dd { margin: 0; font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }

    .crit { display: grid; gap: 1px; background: var(--line-soft); }
    .crit-row { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 11px; padding: 10px 13px; background: var(--panel); align-items: start; }
    .crit-row .id { font: 11px var(--mono); color: var(--dim); padding-top: 2px; }
    .crit-row .txt { font-size: 13px; }
    .crit-row .ev { margin-top: 4px; color: var(--dim); font: 11.5px var(--mono); overflow-wrap: anywhere; }

    .log { margin: 0; font: 11.5px/1.6 var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
    .activity { display:grid; gap:16px; }
    .activity-summary { display:flex; align-items:center; flex-wrap:wrap; gap:6px 16px; padding-bottom:12px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
    .activity-summary strong { color:var(--text); font-weight:500; }
    .activity-summary .attention { color:#e3b341; }
    .activity-filters { display:flex; gap:4px; flex-wrap:wrap; }
    .activity-filter { border:1px solid transparent; background:transparent; border-radius:5px; padding:3px 8px; font-size:12px; color:var(--muted); cursor:pointer; }
    .activity-filter:hover { color:var(--text); background:#1C222B; }
    .activity-filter.on { border-color:var(--line); background:var(--panel); color:var(--text); }
    .activity-filter small { margin-left:4px; color:var(--dim); font:10px var(--mono); }
    .activity-events { border-block:1px solid var(--line); }
    .activity-event { --event-accent:var(--line); position:relative; border-top:1px solid var(--line); }
    .activity-event:first-child { border-top:0; }
    .activity-event::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--event-accent); }
    .activity-event.run, .activity-event.repair { --event-accent:var(--run); }
    .activity-event.warn { --event-accent:var(--warn); }
    .activity-event.bad { --event-accent:var(--bad); }
    .activity-event-main { display:grid; grid-template-columns:72px 10px minmax(0,1fr) auto; gap:10px; align-items:start; padding:8px 12px 8px 14px; }
    .activity-time { padding-top:2px; color:var(--dim); font:11px var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .activity-dot { width:7px; height:7px; margin-top:6px; border-radius:50%; background:var(--event-accent); }
    .activity-copy { min-width:0; }
    .activity-title { font-size:13px; font-weight:500; color:var(--text); overflow-wrap:anywhere; }
    .activity-summary-text { margin-top:2px; color:var(--muted); font-size:12px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .activity-context { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:3px; color:var(--dim); font-size:11px; }
    .activity-context .technical { font-family:var(--mono); }
    .activity-status { display:inline-flex; align-items:center; gap:6px; margin-top:1px; border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--muted); font-size:10px; white-space:nowrap; }
    .activity-status::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--event-accent); }
    .activity-details { margin-left:106px; border-top:1px solid var(--line-soft); }
    .activity-details > summary { width:max-content; cursor:pointer; list-style:none; padding:5px 8px 6px 0; color:var(--dim); font-size:11px; }
    .activity-details > summary::-webkit-details-marker { display:none; }
    .activity-details > summary::after { content:' ▸'; }
    .activity-details[open] > summary::after { content:' ▾'; }
    .activity-details > summary:hover { color:var(--text); }
    .activity-detail { padding:4px 12px 12px 0; overflow:hidden; }
    .activity-detail .kv { margin-bottom:10px; }
    .activity-raw { max-height:320px; overflow:auto; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:#0c0f13; color:var(--muted); font:11px/1.55 var(--mono); white-space:pre; overflow-wrap:normal; }
    .activity-empty { margin:0; padding:4px 0; color:var(--muted); font-size:13px; }

    .notice { border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: 7px; background: var(--panel); padding: 14px; }
    .notice h3 { margin: 0 0 5px; font-size: 14px; font-weight: 600; }
    .notice p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .notice .row { display: flex; gap: 9px; align-items: flex-start; flex-wrap: wrap; }
    textarea { width: 100%; min-height: 74px; resize: vertical; padding: 9px 10px; background: #0c0f13; border: 1px solid var(--line); border-radius: 6px; outline: none; }
    textarea:focus { border-color: #39414b; }
    .err { border-left-color: var(--bad); }
    .err .log { color: #f0a5a0; }

    /* ---- new project dialog ---- */
    dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 0; width: min(520px, calc(100% - 32px)); }
    dialog::backdrop { background: #05070ac9; }
    .dlg-head { padding: 15px 18px; border-bottom: 1px solid var(--line-soft); font-weight: 600; }
    .dlg-body { padding: 18px; }
    .drop { display: block; border: 1px dashed #333a43; border-radius: 8px; padding: 18px; text-align: center; cursor: pointer; position: relative; background: var(--panel-2); }
    .drop:hover { border-color: var(--accent); }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .drop strong { display: block; font-size: 13.5px; font-weight: 550; }
    .drop small { color: var(--dim); }
    .dlg-foot { padding: 13px 18px; border-top: 1px solid var(--line-soft); display: flex; gap: 9px; justify-content: flex-end; }
    .report { margin-top: 13px; font-size: 12.5px; color: var(--muted); }
    .report ul { margin: 6px 0 0; padding-left: 17px; }
    .templates { margin-top: 11px; display: flex; gap: 12px; font-size: 12px; }
    .templates a { color: var(--muted); }

    @media (max-width: 1000px) {
      .shell { grid-template-columns: 1fr; }
      .rail { display: none; }
      .cols-4 { grid-template-columns: repeat(2, 1fr); }
      .cols-2 { grid-template-columns: 1fr; }
    }

    /* Shared rail for the approved project-detail screens. */
    .main.project-layout-screen {
      --project-rail-width: 1120px;
      --project-wide-width: 1440px;
      --project-gutter: 22px;
      --project-section-gap: 20px;
      --project-scrollbar-width: 10px;
      --bg:#0D0F12; --panel:#12161C; --panel-2:#171C23; --line:#272E38; --line-soft:#272E38;
      --text:#F3F4F6; --muted:#A7AFBA; --dim:#737D89;
      background:var(--bg); color:var(--text);
    }
    .project-layout-screen .head, .project-layout-screen .tabs {
      width:100%;
      max-width:calc(var(--project-rail-width) + var(--project-gutter) + var(--project-gutter) + var(--project-scrollbar-width));
      margin-inline:auto;
      padding-right:calc(var(--project-gutter) + var(--project-scrollbar-width));
    }
    .project-layout-screen .body { scrollbar-gutter:stable; scrollbar-width:thin; }
    .project-layout-screen .body::-webkit-scrollbar { width:var(--project-scrollbar-width); }
    .project-layout-screen .head-top > :first-child { flex:1; overflow:hidden; }
    .project-layout-screen h1 { font-size:22px; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .project-layout-screen .path { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:4px; }
    .project-layout-screen .head-actions { align-items:center; flex-wrap:wrap; justify-content:flex-end; max-width:45%; }
    .project-layout-screen .btn.primary { background:var(--text); border-color:var(--text); color:var(--bg); }
    .project-layout-screen .btn:hover:not(:disabled) { background:#1C222B; border-color:#343D49; }
    .project-layout-screen .btn.primary:hover:not(:disabled) { background:var(--muted); border-color:var(--muted); color:var(--bg); }
    .project-layout-screen :is(button, a, summary, textarea, [tabindex]):focus-visible { outline:2px solid var(--run); outline-offset:3px; }
    .project-layout-screen .dot { animation:none; }
    .project-rail { width:100%; max-width:var(--project-rail-width); margin-inline:auto; }
    .project-rail--wide { max-width:var(--project-wide-width); }
    .overview, .validation, .execution { display:grid; gap:var(--project-section-gap); }
    .overview h2 { font-size:14px; font-weight:600; margin:0 0 12px; }
    .overview-state { border-left:2px solid var(--line); padding:4px 0 4px 16px; overflow-wrap:anywhere; }
    .overview-state.warn { border-color:var(--warn); }
    .overview-state.bad { border-color:var(--bad); }
    .overview-state h2 { margin-bottom:4px; }
    .overview-state p { margin:4px 0; color:var(--muted); font-size:13px; }
    .overview-surface { border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:16px; }
    .overview-pipeline { margin:0; }
    .overview-pipeline > div { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:8px 0; border-top:1px solid var(--line); }
    .overview-pipeline > div:first-child { border:0; padding-top:0; }
    .overview-pipeline dd { margin:0; display:flex; align-items:center; gap:8px; text-align:right; }
    .overview-badge { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:4px; padding:2px 8px; font-size:12px; white-space:nowrap; }
    .project-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); padding:12px 0; border-block:1px solid var(--line); }
    .project-metrics > div { padding:0 16px; border-left:1px solid var(--line); }
    .project-metrics > div:first-child { border-left:0; padding-left:0; }
    .project-metrics b { display:block; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .project-metrics :is(span,small) { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
    .overview details > summary { cursor:pointer; color:var(--muted); padding:12px 0; font-size:13px; }
    .overview details[open] > summary { color:var(--text); }
    .overview-details { border-top:1px solid var(--line); overflow-wrap:anywhere; }
    .overview-details .cols-2 { grid-template-columns:1fr; }
    .overview-details .card { border:0; border-radius:0; background:transparent; }
    .overview-details .card > h3 { background:transparent; text-transform:none; letter-spacing:0; }
    .overview-details .notice { background:transparent; }
    .overview-feedback textarea { background:var(--panel); margin-bottom:8px; }
    @media (max-width:700px) {
      .main.project-layout-screen { --project-gutter:16px; --project-section-gap:16px; }
      .project-layout-screen :is(.head, .tabs, .body) { padding-left:var(--project-gutter); }
      .project-layout-screen .body { padding-right:var(--project-gutter); }
      .project-layout-screen :is(.head, .tabs) { padding-right:calc(var(--project-gutter) + var(--project-scrollbar-width)); }
      .project-layout-screen .head-top { flex-direction:column; gap:12px; }
      .project-layout-screen .head-top > :first-child { width:100%; }
      .project-layout-screen .head-actions { margin-left:0; max-width:100%; justify-content:flex-start; }
      .project-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); row-gap:16px; }
      .project-metrics > div:nth-child(3) { border-left:0; padding-left:0; }
      .overview-pipeline dd { flex-wrap:wrap; justify-content:flex-end; }
    }

    /* Validation keeps its approved content treatment on the shared rail. */
    .validation h2 { display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-size:14px; margin:0 0 12px; font-weight:600; }
    .validation h2 > .overview-badge { margin-left:auto; font-weight:400; }
    .validation h3 { font-size:13px; margin:0 0 8px; }
    .validation p { font-size:13px; margin:8px 0 12px; }
    .validation-intro { margin-top:0 !important; }
    .validation-section { border-top:1px solid var(--line); padding-top:16px; }
    .validation-rows { border:1px solid var(--line); border-radius:8px; background:var(--panel); overflow:hidden; }
    .validation-disclosure { border-top:1px solid var(--line); }
    .validation-disclosure:first-child { border-top:0; }
    .validation-disclosure > summary { cursor:pointer; display:flex; align-items:center; gap:12px; padding:8px 12px; font-size:13px; color:var(--muted); list-style:none; }
    .validation-disclosure > summary::-webkit-details-marker { display:none; }
    .validation-disclosure > summary::before { content:'▸'; flex:none; color:var(--dim); }
    .validation-disclosure[open] > summary::before { content:'▾'; }
    .validation-disclosure > summary:hover { background:#1C222B; color:var(--text); }
    .validation-row-label { flex:1; }
    .validation-criterion-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .validation-detail { padding:12px 16px; border-top:1px solid var(--line); overflow-wrap:anywhere; }
    .validation-detail .log { max-height:360px; overflow:auto; }
    .validation-release-meta { margin:16px 0; row-gap:8px; }
    .validation-note { border-left:2px solid var(--line); padding-left:12px; }
    .validation-note.warn { border-color:var(--warn); }
    .validation-note.bad { border-color:var(--bad); }
    .validation-housekeeping h2 { color:var(--muted); }
    @media (max-width:700px) {
      .validation-disclosure > summary { gap:8px; }
    }

    /* Execution content chooses the normal or wide shared rail section by section. */
    .execution-assignment > :is(strong,span) { display:-webkit-box !important; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .execution h2 { display:flex; gap:12px; align-items:baseline; margin:0 0 12px; font-size:14px; font-weight:600; }
    .execution h2 .muted { font-size:12px; font-weight:400; }
    .execution-secondary b { font-size:18px; }
    .execution-idle, .execution-caption { font-size:12px; color:var(--muted); margin:8px 0; }
    .execution-idle { color:var(--text); }
    .execution :is(.execution-details,.execution-task) { border:0; border-top:1px solid var(--line); border-radius:0; background:transparent; }
    .execution :is(.execution-details,.execution-task) > summary { display:flex; align-items:center; gap:12px; cursor:pointer; padding:8px 12px; font-size:13px; list-style:none; }
    .execution summary::-webkit-details-marker { display:none; }
    .execution summary::before { content:'▸'; color:var(--dim); flex:none; }
    .execution details[open] > summary::before { content:'▾'; }
    .execution summary:hover { background:#1C222B; }
    .execution-assignment { flex:1; min-width:0; }
    .execution-assignment strong { display:block; font-size:13px; font-weight:500; overflow-wrap:anywhere; }
    .execution-assignment > span { display:block; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .execution-active { border-left:2px solid var(--run); background:var(--panel); }
    .execution-detail { padding:12px 16px; border-top:1px solid var(--line); overflow-wrap:anywhere; }
    .execution-detail .log { max-height:320px; overflow:auto; margin-top:12px; }
    .execution-tasks { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .execution-task:first-child { border-top:0; }
    .execution-task.run { border-left:2px solid var(--run); background:var(--panel); }
    .execution-task.bad { border-left:2px solid var(--bad); }
    .execution-task.ok .execution-assignment strong { color:var(--muted); }
    .execution-task-time { font-size:12px; color:var(--muted); white-space:nowrap; }
    .execution-table { overflow:auto; }
    .execution-table table { min-width:640px; }
    .execution-timeline { max-height:320px; overflow:auto; border-block:1px solid var(--line); }
    .execution-timeline-row { display:grid; grid-template-columns:180px minmax(200px,1fr) 80px; gap:12px; align-items:center; min-width:520px; padding:4px 0; font-size:11px; }
    .execution-timeline-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
    .execution-track { height:16px; position:relative; background:var(--panel); overflow:hidden; }
    .execution-track i { position:absolute; height:6px; top:5px; min-width:1px; background:#737D89; }
    .execution-track i.run { background:var(--run); }
    .execution-track i.bad { background:var(--bad); }
    .execution-budget-line { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--muted); margin-bottom:8px; }
    .execution-budget-line strong { font-size:18px; color:var(--text); }
    .execution-budget-limit { margin-left:auto; }
    .execution .budget { height:4px; }
    .execution .budget i { background:var(--muted); }
    @media (max-width:700px) {
      .execution summary { flex-wrap:wrap; }
      .execution-assignment { flex-basis:55%; }
      .execution-task-time { display:none; }
      .activity-event-main { grid-template-columns:58px 8px minmax(0,1fr); gap:8px; padding-inline:10px; }
      .activity-status { grid-column:3; width:max-content; }
      .activity-details { margin-left:84px; }
      .activity-detail .kv { grid-template-columns:1fr; gap:3px; }
      .activity-detail .kv dd { margin-bottom:6px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">AI MVP Studio <span id="active-runs"></span></div>
      <div class="topbar-right">
        <div class="health"><i class="dot" id="health-dot"></i><span id="health-text">Codex kontrol ediliyor</span></div>
        <button class="btn primary" id="new-project">Yeni proje</button>
      </div>
    </header>

    <div class="shell">
      <aside class="rail">
        <div class="rail-head"><h2>Projeler</h2><span class="dim mono" id="project-count"></span></div>
        <div class="rail-list" id="projects"></div>
      </aside>
      <main class="main" id="main">
        <div class="empty">Bir proje seçin.</div>
      </main>
    </div>
  </div>

  <dialog id="create-dialog">
    <form method="dialog" id="create-form">
      <div class="dlg-head">Onaylanmış spec yükle</div>
      <div class="dlg-body">
        <label class="drop" for="spec-file">
          <strong id="file-label">PROJECT_SPEC.md seç</strong>
          <small>Markdown · en fazla 200 KB</small>
          <input id="spec-file" type="file" accept=".md,text/markdown,text/plain" />
        </label>
        <div class="templates">
          <a href="/api/spec-template/mobile">Mobil şablon</a>
          <a href="/api/spec-template">Genel şablon</a>
        </div>
        <div class="report" id="validation">Doğrulama sonucu burada görünür.</div>
      </div>
      <div class="dlg-foot">
        <button class="btn" value="cancel" id="cancel-create">Vazgeç</button>
        <button class="btn primary" id="start-button" disabled type="button">Üretimi başlat</button>
      </div>
    </form>
  </dialog>

  <script>
    const RUNNING = ['queued', 'planning', 'building', 'testing', 'technically_verified',
      'device_testing', 'device_repair', 'device_test_passed', 'reviewing', 'review_repair'];
    const RESUMABLE = ['paused_context', 'paused_usage', 'interrupted', 'failed', 'awaiting_device_test'];
    const LABELS = {
      queued: 'Sırada', planning: 'Planlanıyor', building: 'Geliştiriliyor', testing: 'Test ediliyor',
      technically_verified: 'Teknik doğrulama tamam', device_testing: 'Cihazda test ediliyor',
      device_repair: 'Cihaz düzeltmesi', device_test_passed: 'Cihaz testi geçti',
      reviewing: 'İnceleniyor', review_repair: 'İnceleme düzeltmesi',
      awaiting_device_test: 'Cihaz bekleniyor', awaiting_user_review: 'Onayınızı bekliyor',
      accepted: 'Kabul edildi', completed: 'Tamamlandı', failed: 'Başarısız',
      paused_context: 'Context duraklaması', paused_usage: 'Limit duraklaması',
      interrupted: 'Kesildi', pending: 'Bekliyor', ready: 'Hazır', running: 'Çalışıyor',
      validating: 'Doğrulanıyor',
    };
    const ROLE_LABELS = {
      architecture: 'Mimari', ux: 'UX', data_model: 'Veri', test_strategy: 'Test Stratejisi', coordinator: 'Koordinatör', flutter_builder: 'Builder',
      integration: 'Entegrasyon', test: 'Test', repair: 'Onarım', device_repair: 'Cihaz onarımı',
      review_repair: 'İnceleme onarımı', reviewer: 'İnceleme',
    };

    let selectedId = null;
    let activeTab = 'overview';
    let detail = null;
    let eventFilter = 'all';
    let loadedSpec = '';
    let specReady = false;

    const el = id => document.getElementById(id);
    const esc = value => { const d = document.createElement('div'); d.textContent = String(value ?? ''); return d.innerHTML; };
    const num = value => Number(value || 0).toLocaleString('tr-TR');
    const setText = (id, value) => { const node = el(id); if (node.textContent !== value) node.textContent = value; };

    function tone(status) {
      if (['completed', 'accepted', 'awaiting_user_review', 'device_test_passed'].includes(status)) return 'ok';
      if (RUNNING.includes(status) || status === 'running' || status === 'validating') return 'run';
      if (['failed', 'paused_context', 'paused_usage'].includes(status)) return 'bad';
      if (['interrupted', 'awaiting_device_test'].includes(status)) return 'warn';
      return '';
    }
    const label = status => LABELS[status] || status;
    const roleLabel = role => ROLE_LABELS[role] || role;

    function duration(from, to) {
      if (!from) return '—';
      const seconds = Math.max(0, Math.round(((to ? new Date(to) : new Date()) - new Date(from)) / 1000));
      if (seconds < 60) return `${seconds}sn`;
      const minutes = Math.floor(seconds / 60);
      return minutes < 60 ? `${minutes}dk ${seconds % 60}sn` : `${Math.floor(minutes / 60)}sa ${minutes % 60}dk`;
    }

    function formatMs(milliseconds) {
      const seconds = Math.max(0, Math.round(milliseconds / 1000));
      if (seconds < 60) return `${seconds}sn`;
      const minutes = Math.floor(seconds / 60);
      return minutes < 60 ? `${minutes}dk ${seconds % 60}sn` : `${Math.floor(minutes / 60)}sa ${minutes % 60}dk`;
    }

    const runSpan = run => (run.started_at
      ? (run.completed_at ? new Date(run.completed_at) : new Date()) - new Date(run.started_at)
      : 0);

    /** Per-role totals: how much agent time each part of the pipeline consumed. */
    function agentTotals(runs) {
      const byRole = new Map();
      for (const run of runs) {
        const entry = byRole.get(run.role) || { role: run.role, count: 0, ms: 0, fresh: 0, out: 0 };
        entry.count += 1;
        entry.ms += runSpan(run);
        entry.fresh += Math.max(0, (run.input_tokens || 0) - (run.cached_input_tokens || 0));
        entry.out += Number(run.output_tokens || 0);
        byRole.set(run.role, entry);
      }
      return [...byRole.values()].sort((left, right) => right.ms - left.ms);
    }

    /**
     * Wall time during which at least one agent was running. Comparing it with the
     * summed time is the only honest way to read parallelism: agents overlap, so
     * the sum alone says nothing about how long the pipeline actually took.
     */
    function agentBusyMs(runs) {
      const spans = runs
        .filter(run => run.started_at)
        .map(run => [
          +new Date(run.started_at),
          run.completed_at ? +new Date(run.completed_at) : Date.now(),
        ])
        .sort((left, right) => left[0] - right[0]);
      let total = 0;
      let current = null;
      for (const [start, end] of spans) {
        if (!current || start > current[1]) {
          if (current) total += current[1] - current[0];
          current = [start, end];
        } else current[1] = Math.max(current[1], end);
      }
      return current ? total + (current[1] - current[0]) : total;
    }

    /**
     * A task's started_at/completed_at can span several resumes, so the span
     * between them is not a runtime. Only a task running right now has one.
     */
    function taskTiming(task) {
      if (task.status === 'running') return duration(task.started_at);
      if (task.completed_at) return clock(task.completed_at);
      return '—';
    }
    const clock = value => (value ? new Date(value).toLocaleTimeString('tr-TR', { hour12: false }) : '');

    async function api(url, options) {
      const response = await fetch(url, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || 'İşlem başarısız.');
      return body;
    }

    /* ---------- derived views ---------- */

    function lastVerdict(runs) {
      const reviews = runs.filter(run => run.role === 'reviewer' && run.final_message);
      if (!reviews.length) return null;
      const raw = reviews[reviews.length - 1].final_message;
      const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
      try { return JSON.parse(fenced ? fenced[1] : raw); } catch { return null; }
    }

    /** Latest command / file activity an agent reported, for the live view. */
    function agentActivity(events, agentName) {
      const mine = events.filter(event => event.payload && event.payload.agent === agentName);
      let command = null;
      let files = 0;
      for (const event of mine) {
        const item = event.payload.item;
        if (!item) continue;
        if (item.type === 'command_execution' && item.command) command = shortCommand(item.command);
        if (item.type === 'file_change' && event.event_type === 'item.completed') {
          files += (item.changes || []).length;
        }
      }
      return { command, files };
    }

    /** Codex wraps everything in a shell invocation; only the command matters. */
    function shortCommand(command) {
      const stripped = String(command || '')
        .replace(/^"?[^"]*(?:powershell\.exe|cmd\.exe|bash(?:\.exe)?)"?\s*(?:-Command|\/d\s*\/s\s*\/c|-lc)?\s*/i, '')
        .trim();
      // Only unwrap a matching pair; a script may legitimately begin with a quote.
      const first = stripped[0];
      return (first === "'" || first === '"') && stripped.endsWith(first) && stripped.length > 1
        ? stripped.slice(1, -1).trim()
        : stripped;
    }

    function eventSummary(event) {
      const payload = event.payload || {};
      const item = payload.item;
      if (item && item.type === 'command_execution') {
        const exit = item.exit_code === undefined ? '' : ` · exit ${item.exit_code}`;
        return `${shortCommand(item.command).slice(0, 200)}${exit}`;
      }
      if (item && item.type === 'file_change') {
        return (item.changes || []).map(change => `${change.kind}: ${String(change.path).split(/[\\/]/).slice(-2).join('/')}`).join(', ');
      }
      if (item && item.type === 'agent_message') return String(item.text || '').slice(0, 240);
      if (event.event_type === 'stderr') return String(payload.text || '').slice(0, 240);
      const { agent, role, item: _item, type, ...rest } = payload;
      const body = JSON.stringify(rest);
      return body === '{}' ? '' : body.slice(0, 240);
    }

    const ACTIVITY_VALIDATION_EVENTS = new Set([
      'preflight.completed', 'device_test.completed', 'reviewer.contract_rejected',
      'release_readiness.started', 'release_readiness.completed', 'release_readiness.failed',
    ]);
    const ACTIVITY_SYSTEM_EVENTS = new Set([
      'scaffold.created', 'warm_build.completed', 'dependencies.installed', 'task_plan.rejected',
    ]);

    function activityCategory(event) {
      if (event.payload && event.payload.agent) return 'agents';
      if (ACTIVITY_VALIDATION_EVENTS.has(event.event_type)) return 'validation';
      if (ACTIVITY_SYSTEM_EVENTS.has(event.event_type)) return 'system';
      return null;
    }

    function activitySeverity(event) {
      const payload = event.payload || {};
      const item = payload.item || {};
      const status = String(payload.status || item.status || '').toUpperCase();
      const type = String(event.event_type || '').toLowerCase();
      const role = String(payload.role || '').toLowerCase();
      const failedCommand = item.type === 'command_execution'
        && item.exit_code !== undefined && item.exit_code !== null && Number(item.exit_code) !== 0;
      if (failedCommand || ['FAIL', 'FAILED', 'BLOCKED'].includes(status)
        || ['error', 'turn.failed', 'timeout', 'release_readiness.failed'].includes(type)) {
        return { tone:'bad', label:status === 'BLOCKED' ? 'Engellendi' : 'Başarısız', attention:true };
      }
      if (type === 'stderr' || type === 'unparsed_output' || type.endsWith('.rejected')
        || ['WAITING', 'WARNING', 'WARN'].includes(status)) {
        return { tone:'warn', label:status === 'WAITING' ? 'Bekliyor' : 'Dikkat', attention:true };
      }
      if (role.includes('repair') || type.includes('repair') || type.includes('retry')) {
        return { tone:'repair', label:'Onarım', attention:false };
      }
      if (type.endsWith('.started') || type === 'item.started' || status === 'RUNNING') {
        return { tone:'run', label:'Çalışıyor', attention:false };
      }
      if (['PASS', 'READY', 'COMPLETED', 'SUCCESS'].includes(status) || type.endsWith('.completed')) {
        return { tone:'neutral', label:status || 'Tamamlandı', attention:false };
      }
      if (status === 'SKIPPED') return { tone:'neutral', label:'Atlandı', attention:false };
      return { tone:'neutral', label:'Bilgi', attention:false };
    }

    function activityTitle(event) {
      const item = (event.payload || {}).item || {};
      if (event.event_type === 'item.started') {
        if (item.type === 'command_execution') return 'Komut başlatıldı';
        if (item.type === 'file_change') return 'Dosya değişikliği başladı';
      }
      if (event.event_type === 'item.completed') {
        if (item.type === 'command_execution') return 'Komut tamamlandı';
        if (item.type === 'file_change') return 'Dosyalar değiştirildi';
        if (item.type === 'agent_message') return 'Agent mesajı';
      }
      if (event.event_type === 'item.updated' && item.type === 'todo_list') return 'Görev listesi güncellendi';
      return ({
        'context.packaged':'Bağlam paketi hazırlandı',
        'dependencies.installed':'Bağımlılıklar kuruldu',
        'device_test.completed':'Cihaz doğrulaması tamamlandı',
        'error':'Agent hatası',
        'preflight.completed':'Ortam ön kontrolü tamamlandı',
        'release_readiness.started':'Release hazırlık kontrolü başladı',
        'release_readiness.completed':'Release hazırlık kontrolü tamamlandı',
        'release_readiness.failed':'Release hazırlık kontrolü başarısız',
        'reviewer.contract_rejected':'Reviewer sözleşmesi reddedildi',
        'scaffold.created':'Flutter iskeleti oluşturuldu',
        'stderr':'Standart hata çıktısı',
        'task_plan.rejected':'Görev planı reddedildi',
        'thread.started':'Agent oturumu başladı',
        'timeout':'Agent zaman aşımına uğradı',
        'turn.completed':'Agent çalışması tamamlandı',
        'turn.failed':'Agent çalışması başarısız',
        'turn.started':'Agent çalışması başladı',
        'unparsed_output':'Ayrıştırılamayan agent çıktısı',
        'warm_build.completed':'Ön derleme tamamlandı',
      })[event.event_type] || event.event_type;
    }

    function activitySummary(event) {
      const payload = event.payload || {};
      const item = payload.item || {};
      if (item.type || ['stderr', 'unparsed_output'].includes(event.event_type)) return eventSummary(event);
      if (event.event_type === 'context.packaged') return payload.chars ? `${num(payload.chars)} karakter bağlam` : '';
      if (event.event_type === 'dependencies.installed') return (payload.packages || []).join(', ');
      if (event.event_type === 'device_test.completed') return payload.reason || payload.failure_kind || '';
      if (event.event_type === 'error') return payload.message || '';
      if (event.event_type === 'preflight.completed') {
        return [payload.flutter, payload.android_sdk, payload.build_tools]
          .filter(check => check && check.status && check.status !== 'PASS')
          .map(check => check.details || check.status).filter(Boolean).join(' · ');
      }
      if (event.event_type === 'release_readiness.completed') {
        return `${num(payload.blockers || 0)} engel · ${num(payload.warnings || 0)} uyarı`;
      }
      if (event.event_type === 'reviewer.contract_rejected' || event.event_type === 'task_plan.rejected'
        || event.event_type === 'release_readiness.failed') return payload.error || '';
      if (event.event_type === 'scaffold.created') return [payload.project_name, payload.org].filter(Boolean).join(' · ');
      if (event.event_type === 'turn.completed' && payload.usage) {
        return `${num(payload.usage.input_tokens || 0)} giriş · ${num(payload.usage.output_tokens || 0)} çıkış tokenı`;
      }
      if (event.event_type === 'turn.failed') return payload.error?.message || payload.error || '';
      if (event.event_type === 'warm_build.completed' && payload.seconds !== undefined) return `${num(payload.seconds)} sn`;
      return payload.message || payload.text || '';
    }

    function activityContext(event) {
      const payload = event.payload || {};
      const item = payload.item || {};
      const parts = [];
      if (payload.agent) parts.push(`<span title="${esc(payload.agent).replaceAll('"', '&quot;')}">${esc(payload.agent)}</span>`);
      if (payload.role) parts.push(`<span>${esc(roleLabel(payload.role))}</span>`);
      if (item.type) parts.push(`<span class="technical">${esc(item.type)}</span>`);
      if (payload.attempt !== undefined) parts.push(`<span>${num(payload.attempt)}. deneme</span>`);
      return parts.join('');
    }

    function activityDetails(event) {
      const payload = event.payload || {};
      const item = payload.item || {};
      const values = [
        ['Olay türü', event.event_type], ['Kesin zaman', event.created_at],
        ['Agent', payload.agent], ['Rol', payload.role ? roleLabel(payload.role) : null],
        ['Öğe kimliği', item.id], ['Durum', payload.status || item.status],
        ['Tanı kodu', payload.failure_kind || payload.code],
      ].filter(([, value]) => value !== undefined && value !== null && value !== '');
      return `<dl class="kv">${values.map(([key, value]) => `<dt>${esc(key)}</dt><dd>${esc(value)}</dd>`).join('')}</dl>
        <pre class="activity-raw" tabindex="0">${esc(JSON.stringify(event, null, 2))}</pre>`;
    }

    /* ---------- rendering ---------- */

    async function refreshHealth() {
      try {
        const health = await api('/api/health');
        el('health-dot').className = `dot ${health.codex_available ? 'ok' : 'bad'}`;
        el('health-text').textContent = health.codex_available ? 'Codex hazır' : 'Codex bulunamadı';
        tokenBudget = Number(health.token_budget || 0);
      } catch { /* topbar stays as-is */ }
    }

    let railSignature = null;

    async function refreshProjects() {
      const projects = await api('/api/projects');
      const running = projects.filter(project => RUNNING.includes(project.status)).length;
      // Only write when the value moves; needless DOM churn fights the user.
      setText('project-count', String(projects.length));
      setText('active-runs', running ? `${running} çalışıyor` : '');
      // Rewriting the rail on every poll would invalidate whatever the user is
      // interacting with, so it only redraws when the list actually changes.
      const nextRail = JSON.stringify([projects.map(p => [p.id, p.name, p.status]), selectedId]);
      if (nextRail === railSignature) {
        if (selectedId) await loadProject();
        return;
      }
      railSignature = nextRail;
      el('projects').innerHTML = projects.length
        ? projects.map(project => `
          <button class="proj ${project.id === selectedId ? 'active' : ''}" data-id="${project.id}">
            <div class="proj-name"><i class="dot ${tone(project.status)}"></i><b>${esc(project.name)}</b></div>
            <div class="proj-sub"><span>${project.id}</span><span>${esc(label(project.status))}</span></div>
          </button>`).join('')
        : '<div style="padding:14px" class="dim">Henüz proje yok.</div>';
      for (const node of document.querySelectorAll('.proj')) {
        node.onclick = () => {
          selectedId = node.dataset.id;
          lastSignature = null;
          railSignature = null;
          loadProject({ force: true });
        };
      }
      if (!selectedId && projects.length) { selectedId = projects[0].id; }
      if (selectedId) await loadProject();
    }

    /**
     * Everything the panel actually shows. Polling re-renders only when this
     * changes, so open panels, typed feedback and scroll position survive.
     */
    function signature(project) {
      return JSON.stringify([
        project.id, project.status, project.error, project.final_message,
        project.quality_report, project.device_report, project.artifact_path,
        project.release_report, project.release_evaluating,
        (project.tasks || []).map(task => [task.id, task.status, task.attempt_count, task.error]),
        (project.agent_runs || []).map(run => [run.id, run.status, run.output_tokens, run.context_chars]),
        (project.events || []).length,
      ]);
    }

    // UI state lives here rather than being scraped from the DOM, so it survives
    // both background polling and tab switches.
    const openOverview = new Set();
    const openTasks = new Set();
    const autoOpened = new Set();
    const scrollByTab = {};
    let feedbackDraft = '';
    let tokenBudget = 0;

    function captureScroll() {
      const body = document.getElementById('tab-body');
      if (body) scrollByTab[activeTab] = body.scrollTop;
    }

    function restoreUiState() {
      const body = document.getElementById('tab-body');
      if (body && scrollByTab[activeTab]) body.scrollTop = scrollByTab[activeTab];
      const input = document.querySelector('[data-feedback]');
      if (input) {
        input.value = feedbackDraft;
        input.oninput = () => { feedbackDraft = input.value; };
      }
      for (const node of document.querySelectorAll('[data-overview]')) {
        const key = selectedId + ':' + node.dataset.overview;
        node.open = openOverview.has(key);
        node.ontoggle = () => node.open ? openOverview.add(key) : openOverview.delete(key);
      }
      for (const node of document.querySelectorAll('.stage')) {
        node.open = openTasks.has(node.dataset.task);
        node.ontoggle = () => {
          if (node.open) openTasks.add(node.dataset.task);
          else openTasks.delete(node.dataset.task);
        };
      }
    }

    let lastSignature = null;

    async function loadProject({ force = false } = {}) {
      if (!selectedId) return;
      const next = await api(`/api/projects/${selectedId}`);
      for (const node of document.querySelectorAll('.proj')) {
        node.classList.toggle('active', node.dataset.id === selectedId);
      }
      const nextSignature = signature(next);
      const running = (next.agent_runs || []).some(run => run.status === 'running');
      detail = next;
      // A running agent needs its elapsed clock refreshed even when nothing else moved.
      if (!force && nextSignature === lastSignature && !running) return;
      lastSignature = nextSignature;
      renderProject();
    }

    function renderProject() {
      captureScroll();
      const project = detail;
      const tasks = project.tasks || [];
      const runs = project.agent_runs || [];
      const events = project.events || [];
      const active = runs.filter(run => run.status === 'running');
      const canResume = RESUMABLE.includes(project.status);
      const awaits = ['awaiting_user_review', 'accepted'].includes(project.status);

      const tabs = [
        ['overview', 'Genel', ''],
        ['execution', 'Çalışma', active.length ? String(active.length) : ''],
        ['validation', 'Doğrulama', ''],
        ['activity', 'Etkinlik', String(events.length)],
      ];

      el('main').classList.toggle('project-layout-screen', ['overview', 'execution', 'validation', 'activity'].includes(activeTab));
      el('main').classList.toggle('execution-screen', activeTab === 'execution');
      el('main').classList.toggle('overview-screen', ['overview', 'validation'].includes(activeTab));
      el('main').innerHTML = `
        <div class="head">
          <div class="head-top">
            <div>
              <h1 title="${esc(project.name).replaceAll('"', '&quot;')}">${esc(project.name)}</h1>
              <div class="state"><i class="dot ${['overview', 'validation'].includes(activeTab) ? overviewTone(project.status) : tone(project.status)}"></i>${esc(label(project.status))}</div>
              <div class="path" title="${esc(project.workspace_path).replaceAll('"', '&quot;')}">${['overview', 'validation'].includes(activeTab) ? `${esc(project.id.slice(0, 12))} · ` : ''}${esc(project.workspace_path)}</div>
            </div>
            <div class="head-actions">
              ${project.artifact_path ? `<a class="btn" href="/api/projects/${project.id}/artifact">APK indir</a>` : ''}
              ${['overview', 'validation'].includes(activeTab) && project.status === 'awaiting_user_review' ? '<button class="btn primary" data-act="accept">Ürünü kabul et</button>' : ''}
              ${['overview', 'validation'].includes(activeTab) && project.status === 'accepted' ? `<button class="btn primary" data-act="release" ${project.release_evaluating ? 'disabled' : ''}>${project.release_evaluating ? 'Release değerlendiriliyor…' : 'Release hazırlığını değerlendir'}</button>` : ''}
              ${canResume ? `<button class="btn primary" data-act="resume">${project.status === 'awaiting_device_test' ? 'Cihaz testini yeniden dene' : 'Checkpoint’ten devam et'}</button>` : ''}
            </div>
          </div>
        </div>
        <nav class="tabs">
          ${tabs.map(([key, text, count]) => `
            <button class="tab ${activeTab === key ? 'active' : ''}" data-tab="${key}">
              ${text}${count ? `<span class="count">${count}</span>` : ''}
            </button>`).join('')}
        </nav>
        <div class="body" id="tab-body"></div>`;

      const body = el('tab-body');
      if (activeTab === 'overview') body.innerHTML = renderOverview(project, tasks, runs, awaits);
      else if (activeTab === 'execution') body.innerHTML = renderExecution(project, tasks, runs, events, active);
      else if (activeTab === 'validation') body.innerHTML = renderValidation(project, runs);
      else body.innerHTML = renderActivity(events, project, active);

      wire();
      restoreUiState();
    }

    function overviewTone(status) {
      if (['PASS', 'READY', 'ACCEPTED', 'completed', 'accepted'].includes(status)) return 'ok';
      if (['WAITING', 'WARNING', 'WARN', 'pending', 'paused_context', 'paused_usage', 'awaiting_user_review'].includes(status)) return 'warn';
      if (['FAIL', 'FAILED', 'BLOCKED', 'failed'].includes(status)) return 'bad';
      if (status === 'RUNNING') return 'run';
      return tone(status);
    }

    function overviewBadge(status, semanticTone) {
      return '<span class="overview-badge"><i class="dot ' + (semanticTone || overviewTone(status)) + '"></i>' + esc(({completed:'COMPLETED',running:'RUNNING',pending:'WAITING',failed:'FAILED',FAIL:'FAILED',WARN:'WARNING'})[status] || status) + '</span>';
    }

    function renderOverview(project, tasks, runs, awaits) {
      const quality = validationReport(project.quality_report);
      const device = validationReport(project.device_report);
      const release = validationReport(project.release_report);
      const verdict = lastVerdict(runs);
      const criteria = verdict?.criteria || [];
      const done = tasks.filter(t => t.status === 'completed').length;
      const billable = runs.reduce((sum, r) => sum + Math.max(0, (r.input_tokens || 0) - (r.cached_input_tokens || 0)) + Number(r.output_tokens || 0), 0);
      const active = runs.filter(r => r.status === 'running').length;
      const deviceGroup = deviceGroups(device);
      const productChecksPassed = deviceGroup.passed;
      const deviceTone = (deviceGroup.passed && deviceGroup.warning) || device?.failure_kind === 'environment' ? 'warn' : undefined;
      let heading = label(project.status);
      let message = RUNNING.includes(project.status) ? 'Üretim devam ediyor. Aşağıdaki kayıtlı sonuçlar son tamamlanan kontrolleri gösterir.' : 'Kayıtlı doğrulama sonuçlarını aşağıdan inceleyebilirsiniz.';
      if (project.status === 'awaiting_device_test') {
        heading = 'Cihaz doğrulaması müdahale bekliyor';
        message = (productChecksPassed ? 'Ürün kontrolleri geçti. ' : quality?.status === 'PASS' ? 'Kalite kapısı geçti. ' : '') + 'Cihaz doğrulamasını yeniden deneyin. Ayrıntılar Doğrulama sekmesinde.';
      } else if (project.status === 'awaiting_user_review') {
        message = 'Proje onayınızı bekliyor. Kayıtlı kanıtları inceleyin; ürünü kabul edin veya geri bildirimle düzeltme isteyin.';
      } else if (project.status === 'accepted') {
        message = project.release_evaluating ? 'Release değerlendirmesi çalışıyor; proje kabul durumu korunuyor.' : release?.status === 'READY' ? 'Release raporu sideload ile harici test için READY. Mağaza dağıtımı doğrulanmadı.' : release?.status === 'BLOCKED' ? 'Ürün kabul edildi; release hazırlığı BLOCKED. Doğrulama sekmesindeki engelleri inceleyin.' : 'Ürün kabul edildi. Sonraki adım: release hazırlığını değerlendirin.';
      } else if (RESUMABLE.includes(project.status)) {
        message = 'Çalışma durdu. Doğrulama sekmesindeki son kaydı inceleyin; hazır olduğunuzda checkpoint’ten devam edin.';
      }
      const row = (name, status, note = '', semanticTone) => '<div><dt>' + name + '</dt><dd><span class="muted">' + esc(note) + '</span>' + overviewBadge(status, semanticTone) + '</dd></div>';
      return '<div class="overview project-rail">' +
        '<section class="overview-state ' + overviewTone(project.status) + '"><h2>' + esc(heading) + '</h2><p>' + esc(message) + '</p>' +
        '</section>' +
        '<section class="overview-surface"><h2>Pipeline özeti</h2><dl class="overview-pipeline">' +
        row('Görevler', !tasks.length ? 'NOT RUN' : done === tasks.length ? 'completed' : tasks.some(t => t.status === 'running') ? 'running' : tasks.some(t => t.status === 'failed') ? 'failed' : 'pending', done + ' / ' + tasks.length) +
        row('Kalite', quality?.status || 'NOT RUN') + row('Cihaz', device?.status || 'NOT RUN', '', deviceTone) +
        row('Kabul kriterleri', verdict?.status || 'NOT RUN', criteria.length ? criteria.filter(c => c.status === 'PASS').length + ' / ' + criteria.length : '') +
        row('Release', project.release_evaluating ? 'RUNNING' : release?.status || 'NOT RUN', project.status !== 'accepted' && !release ? 'Kabul sonrası kullanılabilir' : '') + '</dl></section>' +
        '<section class="overview-metrics project-metrics" aria-label="Proje ölçümleri">' +
        '<div><b>' + done + ' / ' + tasks.length + '</b><span>Tamamlanan görev</span></div>' +
        '<div><b>' + duration(project.created_at, RUNNING.includes(project.status) ? null : project.updated_at) + '</b><span>Geçen süre</span><small>Beklemeler dahil</small></div>' +
        '<div><b>' + num(billable) + '</b><span>Faturalanabilir token · toplam</span><small>' + (tokenBudget ? 'Koşu bütçesi: ' + num(tokenBudget) : 'Koşu bütçesi sınırsız') + '</small></div>' +
        '<div><b>' + runs.length + '</b><span>Agent koşusu</span><small>' + active + ' aktif</small></div></section>' +
        (awaits ? '<details class="overview-feedback" data-overview="feedback"><summary>Geri bildirim / düzeltme isteği</summary><textarea data-feedback placeholder="Düzeltilmesini istediğiniz noktayı yazın…"></textarea><button class="btn" data-act="feedback">Geri bildirim gönder</button>' + (project.status === 'accepted' ? '<button class="btn" data-act="accept">Kabulü yeniden onayla</button>' : '') + '</details>' : '') +
        '<div><button class="btn" data-tab="validation">Doğrulama kanıtlarını incele →</button></div>' +
        '<details class="overview-details" data-overview="technical"><summary>Proje bilgileri</summary>' +
        '<dl class="kv"><dt>Proje</dt><dd>' + esc(project.id) + '</dd><dt>Workspace</dt><dd>' + esc(project.workspace_path) + '</dd></dl>' +
        '</details></div>';
    }

    /** Presentation only: recorded gate statuses remain authoritative. */
    function validationReport(raw) {
      if (!raw) return null;
      try { return typeof raw === 'string' ? JSON.parse(raw) : raw; }
      catch { return { status: 'UNKNOWN', unreadable: true, raw }; }
    }

    const HOUSEKEEPING_CHECKS = ['app_cleanup', 'package_uninstall', 'avd_wipe'];
    function deviceGroups(device) {
      const checks = Object.entries(device?.checks || {});
      const product = checks.filter(([key]) => !HOUSEKEEPING_CHECKS.includes(key));
      const housekeeping = [
        ...checks.filter(([key]) => HOUSEKEEPING_CHECKS.includes(key)).map(([key, check]) => [key + ' (eski kayıt)', check]),
        ...Object.entries(device?.housekeeping || {}),
      ];
      const passed = ['flow_coverage', 'device_storage', 'integration_test', 'apk_install', 'launch']
        .every(key => device?.checks?.[key]?.status === 'PASS')
        && product.every(([, check]) => check?.status === 'PASS');
      return { product, housekeeping, passed,
        warning: housekeeping.some(([, check]) => ['FAIL', 'FAILED', 'WARN', 'WARNING'].includes(check?.status)) };
    }

    function validationDisclosure(key, title, body) {
      return `<details class="validation-disclosure" data-overview="${esc(key).replaceAll('"', '&quot;')}">
        <summary>${title}</summary><div class="validation-detail">${body}</div></details>`;
    }

    const validationRaw = value => `<pre class="log">${esc(typeof value === 'string' ? value : JSON.stringify(value, null, 2))}</pre>`;

    function validationChecks(entries, prefix, housekeeping = false) {
      const names = { analyze:'Analyze', test:'Tests', apk:'APK build', diagnostics:'Diagnostics',
        flow_coverage:'Flow coverage', device_storage:'Device storage', integration_test:'Integration tests',
        apk_install:'APK install', launch:'Launch', app_cleanup:'App cleanup', avd_wipe:'AVD wipe' };
      return entries.length ? `<div class="validation-rows">${entries.map(([name, value], index) => {
        const check = typeof value === 'string' ? {status:value} : value || {};
        const warning = housekeeping && ['FAIL', 'FAILED', 'WARN'].includes(check.status);
        const status = warning ? 'WARNING' : check.status || 'UNKNOWN';
        return validationDisclosure(`${prefix}-${index}`, `<span class="validation-row-label">${esc(names[name] || name)}</span>${overviewBadge(status)}`,
          validationRaw(check));
      }).join('')}</div>` : '<p class="muted">Henüz kayıtlı kontrol yok.</p>';
    }

    function renderValidation(project, runs) {
      const quality = validationReport(project.quality_report);
      const device = validationReport(project.device_report);
      const release = validationReport(project.release_report);
      const verdict = lastVerdict(runs);
      const criteria = Array.isArray(verdict?.criteria) ? verdict.criteria : [];
      const groups = deviceGroups(device);
      const deviceTone = groups.passed && groups.warning ? 'warn' : device?.failure_kind === 'environment' ? 'warn' : undefined;
      const releaseStatus = project.release_evaluating ? 'RUNNING' : release?.status || 'NOT RUN';
      const acceptanceCount = criteria.length ? `${criteria.filter(c => c.status === 'PASS').length} / ${criteria.length}` : '—';
      const summary = (name, status, note = '', semanticTone) => `<div><dt>${name}</dt><dd><span class="muted">${esc(note)}</span>${overviewBadge(status, semanticTone)}</dd></div>`;
      const section = (title, status, body, semanticTone) => `<section class="validation-section"><h2>${title}${overviewBadge(status, semanticTone)}</h2>${body}</section>`;
      const reportDetails = (key, title, report) => report ? validationDisclosure(key, esc(title), validationRaw(report)) : '';
      const releaseIdentity = release?.identity || {};
      return `<div class="validation project-rail">
        <section class="overview-surface">
          <h2>Doğrulama özeti</h2>
          <p class="muted validation-intro">Son kayıtlı raporlar · yeniden çalışan kontroller tamamlanana kadar önceki sonuçlar görünür.</p>
          <dl class="overview-pipeline">
            ${summary('Kalite', quality?.status || 'NOT RUN')}
            ${summary('Cihaz kapısı', device?.status || 'NOT RUN', groups.passed ? 'Ürün kontrolleri PASS' : '', deviceTone)}
            ${summary('Kabul kriterleri', verdict?.status || 'NOT RUN', acceptanceCount)}
            ${summary('Release', releaseStatus)}
          </dl>
        </section>
        ${section('Kalite kapısı', quality?.status || 'NOT RUN',
          validationChecks(Object.entries(quality?.checks || {}), 'quality') + reportDetails('quality-report', 'Tam kalite raporu / komut çıktıları', quality))}
        ${section('Cihaz doğrulaması', device?.status || 'NOT RUN', `
          ${groups.passed ? '<p class="muted">Kayıtlı ürün kontrollerinin tamamı PASS. Üstteki rozet raporun kayıtlı kapı durumudur; temizlik ayrı gösterilir.</p>' :
            device?.failure_kind ? `<p class="validation-note ${device.failure_kind === 'environment' ? 'warn' : 'bad'}">${device.failure_kind === 'environment' ? 'Ortam sorunu' : 'Ürün doğrulama sorunu'} · ayrıntılar cihaz raporunda.</p>` : ''}
          ${validationChecks(groups.product, 'device')}
          ${reportDetails('device-report', 'Cihaz tanısı / senaryolar / tam rapor', device)}`, deviceTone)}
        ${section(`Kabul kriterleri <span class="muted">${acceptanceCount}</span>`, verdict?.status || 'NOT RUN', `
          ${criteria.length ? `<div class="validation-rows">${criteria.map((item, index) => validationDisclosure(`criterion-${index}`,
            `<span class="mono">${esc(item.id)}</span>${overviewBadge(item.status || 'UNKNOWN')}<span class="validation-criterion-label">${esc(item.text || '')}</span>`,
            `<h3>Kanıt</h3>${validationRaw(item.evidence || 'Kayıtlı kanıt yok.')}${reportDetails(`criterion-raw-${index}`, 'Kriter kaydının tamamı', item)}`)).join('')}</div>` : '<p class="muted">Henüz kriter sonucu yok.</p>'}
          ${verdict?.notes?.length ? reportDetails('review-notes', 'İnceleme notları · engelleyici değil', verdict.notes) : ''}
          ${reportDetails('review-report', 'Tam inceleme kararı', verdict)}
          ${project.final_message ? reportDetails('final-message', 'Sonuç özeti', project.final_message) : ''}`)}
        ${section('Release hazırlığı', releaseStatus, `
          <p class="muted">${project.release_evaluating ? 'Değerlendirme sürüyor. Aşağıdaki veriler varsa önceki rapora aittir.' : release?.status === 'READY' ? 'READY: sideload ile harici test için uygun. Mağaza dağıtımı doğrulanmadı.' : release?.status === 'BLOCKED' ? 'Release adayı engellendi. Bu sonuç projenin kabul durumunu değiştirmez.' : project.status === 'accepted' ? 'Henüz değerlendirilmedi. Başlıktaki eylemle release hazırlığını değerlendirebilirsiniz.' : 'Release değerlendirmesi proje kabul edildikten sonra kullanılabilir.'}</p>
          ${release ? `<dl class="kv validation-release-meta">
            <dt>Application ID</dt><dd>${esc(releaseIdentity.application_id || '—')}</dd>
            <dt>Ad</dt><dd>${esc(releaseIdentity.display_name || '—')}</dd>
            <dt>Sürüm</dt><dd>${esc(releaseIdentity.version_name || '—')}+${esc(releaseIdentity.version_code ?? '—')}</dd>
            <dt>Artefakt</dt><dd>${release.artifact?.size_bytes != null ? `${num(Math.round(release.artifact.size_bytes / 1024 / 1024 * 10) / 10)} MiB` : '—'}</dd>
            <dt>Uyarılar</dt><dd>${num(release.warnings?.length)}</dd>
          </dl>
          ${(release.blockers || []).map((item, index) => validationDisclosure(`release-blocker-${index}`, `${overviewBadge('BLOCKED')}<span>${esc(item.title || item.id)}</span>`, validationRaw(item))).join('')}
          ${(release.warnings || []).length ? reportDetails('release-warnings', `Uyarılar (${release.warnings.length}) · engelleyici değil`, release.warnings) : ''}
          ${reportDetails('release-report', 'Teknik release raporu · SHA-256 / yol / imza / manifest', release)}` : ''}`)}
        <section class="validation-section validation-housekeeping">
          <h2>Ortam / temizlik ${groups.warning ? overviewBadge('WARNING') : ''}</h2>
          <p class="muted">Temizlik ürün doğrulamasından ayrıdır.${groups.passed ? ' Kayıtlı ürün kontrolleri PASS olarak korunur.' : ''}</p>
          ${validationChecks(groups.housekeeping, 'housekeeping', true)}
          ${reportDetails('device-target', 'Android hedef sınıflandırması', device?.target)}
          ${reportDetails('device-notes', 'Test sonrası notlar', device?.notes?.length ? device.notes : null)}
          ${device?.reason || project.error ? reportDetails('project-diagnostics', 'Kayıtlı bekleme / hata ayrıntıları', {failure_kind:device?.failure_kind, reason:device?.reason, project_error:project.error}) : ''}
        </section>
      </div>`;
    }


    /** Only recorded intervals (or a currently running interval) support timing. */
    function executionIntervals(runs, now = Date.now()) {
      return runs.flatMap(run => {
        const start = run.started_at ? Date.parse(run.started_at) : NaN;
        const end = run.completed_at ? Date.parse(run.completed_at) : run.status === 'running' ? now : NaN;
        return Number.isFinite(start) && Number.isFinite(end) && end >= start ? [{run, start, end}] : [];
      });
    }

    function executionPeak(intervals) {
      // End before start at equal timestamps: adjacent runs do not overlap.
      const points = intervals.filter(i => i.end > i.start).flatMap(i => [[i.start, 1], [i.end, -1]])
        .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      let current = 0, peak = 0;
      for (const [, delta] of points) { current += delta; peak = Math.max(peak, current); }
      return peak;
    }

    function executionTask(run, tasks) {
      // A role alone is ambiguous when several builders are active.
      const named = tasks.filter(t => run.agent_name === `Flutter Builder: ${t.name}` || run.agent_name === t.name);
      if (named.length === 1) return named[0];
      const workspace = tasks.filter(t => t.workspace_path && t.workspace_path === run.workspace_path);
      if (workspace.length === 1) return workspace[0];
      const role = tasks.filter(t => t.role === run.role);
      return role.length === 1 ? role[0] : null;
    }

    function executionBadge(status) {
      const text = { running:'RUNNING', completed:'COMPLETED', failed:'FAILED', pending:'WAITING',
        ready:'READY', blocked:'BLOCKED', skipped:'SKIPPED' }[status] || label(status);
      return overviewBadge(text, overviewTone(status));
    }

    function executionDetails(key, summary, body, rail = '') {
      return `<details class="execution-details ${rail}" data-overview="execution-${esc(key).replaceAll('"', '&quot;')}">
        <summary>${summary}</summary><div class="execution-detail">${body}</div></details>`;
    }

    function renderExecution(project, tasks, runs, events, active) {
      const intervals = executionIntervals(runs);
      const intervalFor = run => intervals.find(i => i.run === run);
      const valid = new Set(intervals.map(i => i.run));
      // Keep the existing sum / union definition of effective parallelism.
      const totals = agentTotals(runs.map(r => valid.has(r) ? r : {...r, started_at:null}));
      const summed = totals.reduce((sum, entry) => sum + entry.ms, 0);
      const busy = agentBusyMs(runs.filter(r => valid.has(r)));
      const overlap = busy > 0 ? summed / busy : 0;
      const billable = runs.reduce((sum, r) => sum + Math.max(0, (r.input_tokens || 0) - (r.cached_input_tokens || 0)) + Number(r.output_tokens || 0), 0);
      const done = tasks.filter(t => t.status === 'completed').length;
      const completedRuns = runs.filter(r => r.status === 'completed').length;
      const repairRuns = runs.filter(r => ['repair', 'device_repair', 'review_repair'].includes(r.role)).length;
      const metric = (value, title, note = '') => `<div><b>${value}</b><span>${title}</span>${note ? `<small>${note}</small>` : ''}</div>`;
      const runDuration = run => intervalFor(run) ? formatMs(intervalFor(run).end - intervalFor(run).start) : '—';
      const roleRows = totals.map(entry => `<tr><td>${esc(roleLabel(entry.role))}</td><td class="num">${entry.count}</td>
        <td class="num">${formatMs(entry.ms)}</td><td class="num">${summed ? Math.round(entry.ms / summed * 100) : 0}%</td>
        <td class="num">${num(entry.fresh)}</td><td class="num">${num(entry.out)}</td></tr>`).join('');
      return `<div class="execution">
        <section aria-label="Çalışma özeti" class="execution-metrics project-metrics project-rail">
          ${metric(`${done} / ${tasks.length}`, 'Tamamlanan görev')}
          ${metric(String(active.length), 'Aktif agent', 'Anlık eşzamanlılık')}
          ${metric(duration(project.created_at, RUNNING.includes(project.status) ? null : project.updated_at), 'Geçen süre', 'Beklemeler dahil')}
          ${metric(intervals.length ? String(executionPeak(intervals)) : '—', 'Tepe eşzamanlılık', 'Kayıtlı zaman aralıkları')}
        </section>
        <section class="project-rail"><h2>Şu anda</h2>
          ${active.length ? `<div class="execution-active">${active.map(run => {
            const task = executionTask(run, tasks);
            const activity = agentActivity(events, run.agent_name);
            return executionDetails(`active-${run.id}`, `<span class="execution-assignment"><strong>${esc(roleLabel(run.role))}</strong><span title="${esc(task?.name || run.agent_name).replaceAll('"', '&quot;')}">${esc(task?.name || run.agent_name)}</span></span>${executionBadge(run.status)}<span class="mono">${runDuration(run)}</span>`,
              `<dl class="kv"><dt>Agent</dt><dd>${esc(run.agent_name)}</dd><dt>Görev</dt><dd>${esc(task?.name || 'Kesin görev eşleşmesi yok')}</dd><dt>Worktree</dt><dd>${esc(run.workspace_path || '—')}</dd><dt>Son komut</dt><dd>${esc(activity.command || 'Kayıtlı komut yok')}</dd><dt>Dosya değişimi</dt><dd>${num(activity.files)}</dd><dt>Context</dt><dd>${num(run.context_chars)} karakter</dd><dt>Çıkış tokenı</dt><dd>${num(run.output_tokens)}</dd></dl>`);
          }).join('')}</div>` : `<p class="execution-idle">Şu anda çalışan agent yok. <span class="muted">${completedRuns} koşu tamamlandı · ${runs.length} toplam koşu.</span></p>`}
        </section>
        <section class="project-rail project-rail--wide"><h2>Görev ilerlemesi <span class="muted">${done} / ${tasks.length}</span></h2>
          <p class="execution-caption">Görev listesi sıra veya dalga belirtmez; bağımlılıklar görev ayrıntılarındadır.</p>
          ${renderExecutionTasks(tasks)}
        </section>
        <section class="project-rail project-rail--wide"><h2>Zaman çizelgesi / paralellik</h2>
          ${renderExecutionTimeline(intervals)}
          ${intervals.length < runs.length ? `<p class="execution-caption">${runs.length - intervals.length} koşunun zaman aralığı eksik/geçersiz; süre ve eşzamanlılık ölçümlerine dahil edilmedi.</p>` : ''}
        </section>
        <section class="project-rail"><h2>Performans</h2><div class="execution-metrics project-metrics execution-secondary">
          ${metric(String(runs.length), 'Agent koşusu', `${repairRuns} onarım rolü koşusu`)}
          ${metric(formatMs(summed), 'Toplam agent süresi')}
          ${metric(formatMs(busy), 'Agent meşgul süresi', 'En az bir agent aktif')}
          ${metric(busy ? `×${overlap.toFixed(2)}` : '—', 'Etkin paralellik', 'Toplam süre / meşgul süre')}
        </div></section>
        <section class="project-rail"><h2>Token bütçesi</h2>
          <div class="execution-budget-line"><strong>${num(billable)}</strong><span>faturalanabilir token · proje toplamı</span><span class="execution-budget-limit">${tokenBudget ? `${num(tokenBudget)} / koşu limiti` : 'Sınırsız'}</span></div>
          ${tokenBudget ? `<div class="budget" aria-label="Proje toplamının tek koşu limitine oranı"><i style="width:${Math.min(100, billable / tokenBudget * 100)}%"></i></div>
            <p class="execution-caption">Proje toplamı / tek koşu limiti: %${num(Math.round(billable / tokenBudget * 100))}. Bu oran güncel koşunun bütçe tüketimi değildir.</p>` : ''}
          <p class="execution-caption">Faturalanabilir = cache dışı giriş + çıkış. Devam ettirmek yeni bütçe başlatır; güncel koşunun sıfırlama başlangıcı API’de bulunmuyor.</p>
        </section>
        ${executionDetails('roles', `Rol bazında süre ve tokenlar <span class="muted">${totals.length} rol</span>`,
          `<div class="execution-table" tabindex="0" role="region" aria-label="Rol tablosu"><table><thead><tr><th>Rol</th><th>Koşu</th><th>Toplam süre</th><th>Pay</th><th>Cache dışı giriş</th><th>Çıkış</th></tr></thead><tbody>${roleRows || '<tr><td colspan="6">Henüz koşu yok.</td></tr>'}</tbody></table></div>`, 'project-rail project-rail--wide')}
        ${executionDetails('runs', `Tekil agent koşuları <span class="muted">${runs.length} koşu</span>`,
          runs.length ? runs.slice().reverse().map(run => {
            const task = executionTask(run, tasks);
            return executionDetails(`run-${run.id}`, `<span class="execution-assignment"><strong title="${esc(run.agent_name).replaceAll('"', '&quot;')}">${esc(run.agent_name)}</strong><span>${esc(roleLabel(run.role))}${task ? ` · ${esc(task.name)}` : ''}</span></span>${executionBadge(run.status)}<span class="mono">${runDuration(run)}</span>${run.retry_count ? `<span class="muted">${num(run.retry_count)} retry</span>` : ''}`,
              `<dl class="kv"><dt>Başlangıç</dt><dd>${esc(run.started_at || '—')}</dd><dt>Bitiş</dt><dd>${esc(run.completed_at || '—')}</dd><dt>Cache dışı giriş</dt><dd>${num(Math.max(0, (run.input_tokens || 0) - (run.cached_input_tokens || 0)))}</dd><dt>Çıkış</dt><dd>${num(run.output_tokens)}</dd></dl>${validationRaw(run)}`);
          }).join('') : '<p class="execution-caption">Henüz agent koşusu yok.</p>', 'project-rail project-rail--wide')}
      </div>`;
    }

    function renderExecutionTasks(tasks) {
      if (!tasks.length) return '<p class="execution-idle">Henüz görev planı yok.</p>';
      return `<div class="execution-tasks">${tasks.map(task => {
        const retryable = ['failed', 'paused_context', 'paused_usage', 'interrupted'].includes(task.status);
        const dependencies = (task.depends_on || []).map(id => tasks.find(t => t.id === id)?.name || id);
        return `<details class="stage execution-task ${overviewTone(task.status)}" data-task="${esc(task.id).replaceAll('"', '&quot;')}">
          <summary><span class="execution-assignment"><strong title="${esc(task.name).replaceAll('"', '&quot;')}">${esc(task.name)}</strong><span>${esc(roleLabel(task.role))}${dependencies.length ? ` · ${dependencies.length} bağımlılık` : ''}${task.attempt_count ? ` · ${num(task.attempt_count)} deneme` : ''}</span></span>${executionBadge(task.status)}<span class="execution-task-time">${task.status === 'running' ? taskTiming(task) : task.completed_at ? 'Bitiş ' + taskTiming(task) : '—'}</span></summary>
          <div class="execution-detail"><dl class="kv"><dt>Bağımlılıklar</dt><dd>${esc(dependencies.join(', ') || 'Yok')}</dd><dt>Yollar</dt><dd>${esc((task.allowed_paths || []).join(', ') || '—')}</dd><dt>Çıktılar</dt><dd>${esc((task.required_outputs || []).join(', ') || '—')}</dd><dt>Branch</dt><dd>${esc(task.branch_name || '—')}</dd><dt>Checkpoint</dt><dd>${esc(task.checkpoint_commit || '—')}</dd></dl>
            ${retryable ? `<button class="btn" data-act="retry" data-task="${encodeURIComponent(task.id)}">Görevi yeniden dene</button>` : ''}
            ${task.error ? `<pre class="log">${esc(task.error)}</pre>` : ''}
            ${executionDetails(`task-raw-${task.id}`, 'Tam görev kaydı', validationRaw(task))}
          </div></details>`;
      }).join('')}</div>`;
    }

    function renderExecutionTimeline(intervals) {
      if (!intervals.length) return '<p class="execution-idle">Zaman çizelgesi için kayıtlı başlangıç/bitiş aralığı yok.</p>';
      const first = Math.min(...intervals.map(i => i.start));
      const last = Math.max(...intervals.map(i => i.end));
      const span = Math.max(1, last - first);
      return `<p class="execution-caption">Ortak zaman ölçeği · ${esc(new Date(first).toLocaleString('tr-TR'))} → ${esc(new Date(last).toLocaleString('tr-TR'))}. Boşluklar beklemeleri içerir.</p>
        <div class="execution-timeline" tabindex="0" role="region" aria-label="Agent koşularının ortak zaman ölçeği">
          ${intervals.slice().sort((a,b) => a.start - b.start).map(({run, start, end}) => `<div class="execution-timeline-row">
            <span class="execution-timeline-name" title="${esc(run.agent_name).replaceAll('"','&quot;')}">${esc(run.agent_name)}</span>
            <div class="execution-track" title="${esc(`${run.started_at} → ${run.completed_at || 'Şimdi'} · ${label(run.status)}`).replaceAll('"','&quot;')}"><i class="${run.status === 'running' ? 'run' : run.status === 'failed' ? 'bad' : ''}" style="left:${(start-first)/span*100}%;width:${(end-start)/span*100}%"></i></div>
            <span class="mono">${formatMs(end-start)}</span></div>`).join('')}
        </div>`;
    }

    function renderActivity(events, project, active) {
      const groups = [['all', 'Tümü'], ['agents', 'Agentlar'], ['validation', 'Doğrulama'],
        ['system', 'Sistem'], ['errors', 'Hatalar']];
      const matches = event => eventFilter === 'all'
        || (eventFilter === 'errors' ? activitySeverity(event).attention : activityCategory(event) === eventFilter);
      const counts = Object.fromEntries(groups.map(([key]) => [key,
        events.filter(event => key === 'all' || (key === 'errors'
          ? activitySeverity(event).attention : activityCategory(event) === key)).length]));
      const visible = events.filter(matches).slice().reverse();
      const attention = counts.errors;
      const rows = visible.map(event => {
        const severity = activitySeverity(event);
        const summary = String(activitySummary(event) || '').slice(0, 320);
        const context = activityContext(event);
        return `<article class="activity-event ${severity.tone}">
          <div class="activity-event-main">
