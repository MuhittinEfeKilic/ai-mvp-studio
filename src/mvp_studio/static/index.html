            <time class="activity-time" datetime="${esc(event.created_at).replaceAll('"', '&quot;')}">${clock(event.created_at)}</time>
            <i class="activity-dot" aria-hidden="true"></i>
            <div class="activity-copy">
              <div class="activity-title">${esc(activityTitle(event))}</div>
              ${summary ? `<div class="activity-summary-text">${esc(summary)}</div>` : ''}
              ${context ? `<div class="activity-context">${context}</div>` : ''}
            </div>
            <span class="activity-status">${esc(severity.label)}</span>
          </div>
          <details class="activity-details" data-overview="activity-${event.id}">
            <summary>Detaylar</summary><div class="activity-detail">${activityDetails(event)}</div>
          </details>
        </article>`;
      }).join('');
      const eventCount = events.length === 400 ? 'Son 400 olay' : `${num(events.length)} olay`;
      const latest = events.length ? new Date(events[events.length - 1].created_at).toLocaleString('tr-TR') : '';
      return `<div class="activity project-rail">
        ${events.length ? `<div class="activity-summary">
          <strong>${eventCount}</strong>
          ${attention ? `<span class="attention">${num(attention)} dikkat gerektiren</span>` : '<span>Dikkat gerektiren olay yok</span>'}
          <span>Son olay ${esc(latest)}</span>
          ${active.length ? `<span>${num(active.length)} agent çalışıyor</span>` : `<span>${esc(label(project.status))}</span>`}
          <span>En yeni üstte</span>
        </div>` : ''}
        <div class="activity-filters" role="group" aria-label="Etkinlik filtreleri">${groups.map(([key, text]) =>
          `<button class="activity-filter ${eventFilter === key ? 'on' : ''}" data-filter="${key}" aria-pressed="${eventFilter === key}">${text}<small>${num(counts[key])}</small></button>`).join('')}</div>
        ${events.length ? `<div class="activity-events">${rows || '<p class="activity-empty">Bu filtrede olay yok.</p>'}</div>`
          : '<p class="activity-empty">Henüz etkinlik kaydedilmedi.</p>'}
      </div>`;
    }

    /* ---------- interactions ---------- */

    function wire() {
      for (const node of document.querySelectorAll('[data-tab]')) {
        node.onclick = () => {
          captureScroll();
          activeTab = node.dataset.tab;
          lastSignature = null;
          renderProject();
        };
      }
      for (const node of document.querySelectorAll('[data-filter]')) {
        node.onclick = () => { eventFilter = node.dataset.filter; lastSignature = null; renderProject(); };
      }
      const act = async (node, run) => {
        node.disabled = true;
        try { await run(); await loadProject({ force: true }); } catch (error) { node.disabled = false; alert(error.message); }
      };
      const resume = document.querySelector('[data-act="resume"]');
      if (resume) resume.onclick = () => act(resume, () => api(`/api/projects/${selectedId}/resume`, { method: 'POST' }));
      const accept = document.querySelector('[data-act="accept"]');
      if (accept) accept.onclick = () => act(accept, () => api(`/api/projects/${selectedId}/accept`, { method: 'POST' }));
      const feedback = document.querySelector('[data-act="feedback"]');
      if (feedback) {
        feedback.onclick = () => {
          const input = document.querySelector('[data-feedback]');
          const message = input.value.trim();
          if (!message) { input.focus(); return; }
          act(feedback, () => api(`/api/projects/${selectedId}/feedback`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }),
          }));
        };
      }
      const release = document.querySelector('[data-act="release"]:not([disabled])');
      if (release) {
        release.onclick = () => act(release, () => api(
          `/api/projects/${selectedId}/release-readiness`, { method: 'POST' },
        ));
      }
      for (const node of document.querySelectorAll('[data-act="retry"]')) {
        node.onclick = () => act(node, () => api(
          `/api/projects/${selectedId}/tasks/${node.dataset.task}/retry`, { method: 'POST' },
        ));
      }
    }

    function resetCreateDialog() {
      // A file input does not fire `change` when the same file is picked again, so
      // reopening the dialog and re-selecting the spec would leave the button
      // disabled with no explanation. Clearing it makes every pick count.
      el('create-form').reset();
      el('spec-file').value = '';
      loadedSpec = '';
      specReady = false;
      el('start-button').disabled = true;
      el('file-label').textContent = 'PROJECT_SPEC.md seç';
      el('validation').textContent = 'Doğrulama sonucu burada görünür.';
    }

    el('new-project').onclick = () => {
      resetCreateDialog();
      el('create-dialog').showModal();
    };
    el('cancel-create').onclick = () => el('create-dialog').close();
    el('create-dialog').addEventListener('close', resetCreateDialog);

    el('spec-file').onchange = async event => {
      const file = event.target.files[0];
      el('file-label').textContent = file ? file.name : 'PROJECT_SPEC.md seç';
      loadedSpec = file ? await file.text() : '';
      specReady = false;
      el('start-button').disabled = true;
      if (!loadedSpec) { el('validation').textContent = 'Dosya okunamadı.'; return; }
      try {
        const report = await api('/api/specs/validate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spec_content: loadedSpec }),
        });
        specReady = report.ready;
        el('start-button').disabled = !report.ready;
        el('validation').innerHTML = `
          <div class="state"><i class="dot ${report.ready ? 'ok' : 'bad'}"></i>
            ${report.ready ? 'Üretime hazır' : 'Eksik kararlar var'} · ${esc(report.project_name || 'İsimsiz')} · ${report.score}/100</div>
          ${report.blocking_issues.length ? `<ul>${report.blocking_issues.map(issue =>
            `<li>${esc(issue.section)}: ${esc(issue.message)}</li>`).join('')}</ul>` : ''}`;
      } catch (error) { el('validation').textContent = error.message; }
    };

    el('start-button').onclick = async () => {
      if (!specReady || !loadedSpec) return;
      el('start-button').disabled = true;
      try {
        const project = await api('/api/projects', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spec_content: loadedSpec }),
        });
        selectedId = project.id;
        activeTab = 'execution';
        railSignature = null;
        lastSignature = null;
        el('create-dialog').close();
        await refreshProjects();
      } catch (error) {
        el('validation').textContent = error.message;
        el('start-button').disabled = false;
      }
    };

    refreshHealth();
    refreshProjects().catch(error => { el('main').innerHTML = `<div class="empty">${esc(error.message)}</div>`; });
    setInterval(() => refreshProjects().catch(() => {}), 4000);
    setInterval(refreshHealth, 30000);
  </script>
</body>
